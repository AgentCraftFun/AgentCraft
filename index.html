<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCraft</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
#loading { position: fixed; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#loading h1 { color: #7fdbca; font-size: 28px; margin-bottom: 16px; }
#loading p { color: #888; font-size: 14px; }
#loading .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #7fdbca; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
#reconnect { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 999; flex-direction: column; }
#reconnect h2 { color: #ff6b6b; margin-bottom: 10px; }
#reconnect p { color: #888; }
#game-container { display: none; width: 100vw; height: 100vh; position: relative; }
#gameCanvas { position: absolute; top: 0; left: 0; cursor: grab; image-rendering: pixelated; }
#sidebar { position: absolute; top: 0; right: 0; width: 280px; height: 100vh; background: rgba(20,20,40,0.92); border-left: 2px solid #333; overflow-y: auto; z-index: 10; padding: 12px; font-size: 12px; }
#topbar { position: absolute; top: 0; left: 0; right: 280px; height: 40px; background: rgba(20,20,40,0.92); border-bottom: 2px solid #333; z-index: 10; display: flex; align-items: center; padding: 0 16px; gap: 20px; font-size: 13px; }
#topbar .title { color: #7fdbca; font-weight: bold; font-size: 16px; }
#topbar .stat { color: #aaa; }
#topbar .stat span { color: #e0e0e0; font-weight: bold; }
#minimap { width: 254px; height: 160px; border: 1px solid #555; margin-bottom: 10px; image-rendering: pixelated; }
.section-title { color: #7fdbca; font-size: 13px; font-weight: bold; margin: 10px 0 6px; border-bottom: 1px solid #333; padding-bottom: 3px; }
.agent-item { padding: 4px 6px; margin: 2px 0; border-radius: 3px; background: rgba(255,255,255,0.04); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.agent-item:hover { background: rgba(255,255,255,0.1); }
.agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.agent-name { font-weight: bold; color: #ddd; }
.agent-task { color: #888; font-size: 11px; }
.agent-health-bar { width: 40px; height: 4px; background: #333; border-radius: 2px; margin-left: auto; }
.agent-health-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.settlement-item { padding: 4px 6px; margin: 2px 0; color: #cda; }
.event-item { padding: 3px 0; color: #999; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.event-item:first-child { color: #ddd; }
#deploy-panel { margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; }
#deploy-panel input, #deploy-panel select { width: 100%; padding: 4px 6px; margin: 3px 0; background: #1a1a2e; color: #e0e0e0; border: 1px solid #444; border-radius: 3px; font-family: inherit; font-size: 12px; }
#deploy-panel button, .influence-btn { width: 100%; padding: 6px; margin: 3px 0; background: #2a5a4a; color: #7fdbca; border: 1px solid #3a7a6a; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 12px; }
#deploy-panel button:hover, .influence-btn:hover { background: #3a7a6a; }
.influence-btn { background: #3a3a5a; color: #aab; border-color: #555; }
.points-display { color: #ffd700; font-weight: bold; text-align: center; margin: 6px 0; }
.event-banner { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); background: rgba(20,20,40,0.95); border: 2px solid #7fdbca; border-radius: 6px; padding: 10px 24px; color: #7fdbca; font-size: 14px; font-weight: bold; z-index: 20; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
.event-banner.visible { opacity: 1; }
</style>
</head>
<body>
<div id="loading"><h1>AGENTCRAFT</h1><p>Connecting to the living world...</p><div class="spinner"></div></div>
<div id="reconnect"><h2>Disconnected</h2><p>Reconnecting...</p></div>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="topbar">
    <span class="title">AGENTCRAFT</span>
    <span class="stat">Era: <span id="era-display">Wood</span></span>
    <span class="stat">Pop: <span id="pop-display">0</span></span>
    <span class="stat">Buildings: <span id="bld-display">0</span></span>
    <span class="stat">Day: <span id="day-display">1</span></span>

  </div>
  <div id="sidebar">
    <canvas id="minimap" width="254" height="160"></canvas>
    <div id="agent-detail" style="display:none;padding:8px;background:rgba(255,255,255,0.06);border-radius:4px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span id="detail-name" style="font-weight:bold;color:#7fdbca;font-size:14px"></span>
        <span id="detail-close" style="cursor:pointer;color:#888">[x]</span>
      </div>
      <div id="detail-info" style="font-size:11px;color:#bbb;margin-top:4px"></div>
      <div id="detail-stats" style="font-size:11px;margin-top:4px"></div>
      <div id="detail-inventory" style="font-size:11px;margin-top:4px"></div>
      <div id="detail-relations" style="font-size:11px;margin-top:4px;color:#999"></div>
    </div>
    <div class="section-title">ACTIVE AGENTS</div>
    <div id="agent-list"></div>
    <div class="section-title">SETTLEMENTS</div>
    <div id="settlement-list"></div>
    <div class="section-title">CLANS</div>
    <div id="clan-list"></div>
    <div class="section-title">EVENT FEED</div>
    <div id="event-feed"></div>
    <div class="section-title">SPECTATOR</div>
    <div class="points-display">Points: <span id="points-display">0</span></div>
    <div id="deploy-panel">
      <input id="deploy-name" placeholder="Agent name" maxlength="16">
      <select id="deploy-race"><option value="human">Human</option><option value="dwarf">Dwarf</option><option value="elf">Elf</option><option value="orc">Orc</option></select>
      <select id="deploy-personality"><option value="analyst">Analyst</option><option value="optimist">Optimist</option><option value="dreamer">Dreamer</option><option value="overachiever">Overachiever</option><option value="aggressive">Aggressive</option><option value="chaotic">Chaotic</option><option value="grinder">Grinder</option><option value="lazy">Lazy</option></select>
      <button id="deploy-btn">Deploy Agent</button>
    </div>
    <div style="margin-top:6px">
      <button class="influence-btn" id="btn-food">Drop Food (10 pts)</button>
      <button class="influence-btn" id="btn-rain">Trigger Rain (15 pts)</button>
      <button class="influence-btn" id="btn-speed">Speed Boost (20 pts)</button>
      <button class="influence-btn" id="btn-gift">Mystery Gift (25 pts)</button>
    </div>
  </div>
  <div class="event-banner" id="event-banner"></div>
</div>
<script>
// ============================================================================
// CLIENT — Noise & Terrain (identical to server, seed 42)
// ============================================================================
const WORLD_WIDTH = 200, WORLD_HEIGHT = 200, TILE_SIZE = 16;

function seededRandom(seed) {
  let s = seed;
  return function() { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}
function hashCell(x, y, seed) {
  let h = seed;
  h = ((h << 5) - h + x) | 0;
  h = ((h << 5) - h + y) | 0;
  h = ((h << 5) - h + x * 31) | 0;
  h = ((h << 5) - h + y * 17) | 0;
  return ((h & 0x7fffffff) % 10000) / 10000;
}
const PERM = new Uint8Array(512);
(function() {
  const rng = seededRandom(42);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function grad2d(hash, x, y) { const h = hash & 3; return (h & 1 ? x : -x) + (h & 2 ? y : -y); }
function noise2d(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = PERM[X] + Y, b = PERM[X + 1] + Y;
  return 0.5 + 0.5 * (grad2d(PERM[a], xf, yf) * (1-u) * (1-v) + grad2d(PERM[b], xf-1, yf) * u * (1-v) + grad2d(PERM[a+1], xf, yf-1) * (1-u) * v + grad2d(PERM[b+1], xf-1, yf-1) * u * v);
}
function fbm(x, y, oct, lac, gain) {
  let sum = 0, amp = 1, freq = 1, max = 0;
  for (let i = 0; i < oct; i++) { sum += noise2d(x*freq, y*freq)*amp; max += amp; amp *= gain; freq *= lac; }
  return sum / max;
}
function getBiome(e, m) {
  if (e < 0.22) return 'deep_water'; if (e < 0.30) return 'shallow_water'; if (e < 0.33) return 'beach';
  if (e > 0.85) return 'snow'; if (e > 0.75) return 'mountain'; if (e > 0.65) return 'mountain_base';
  if (m < 0.25 && e < 0.55) return 'desert'; if (m > 0.7 && e < 0.4) return 'swamp';
  if (m > 0.6) return 'dense_forest'; if (m > 0.4) return 'forest'; return 'grass';
}

// Biome colors (two shades for checkerboard)
const BIOME_COLORS = {
  deep_water: ['#1a3a5c', '#1e4068'],
  shallow_water: ['#2a6a8a', '#3078a0'],
  beach: ['#d4c490', '#ddd0a0'],
  grass: ['#5a8f3a', '#4e8030'],
  forest: ['#3a6e2a', '#346428'],
  dense_forest: ['#2a5020', '#244a1c'],
  desert: ['#c8b060', '#d0b868'],
  mountain_base: ['#7a7a6a', '#6e6e5e'],
  mountain: ['#8a8a7a', '#7e7e6e'],
  snow: ['#dde8ee', '#e8f0f4'],
  swamp: ['#3a5a3a', '#344e34']
};

// Generate terrain data locally (matches server exactly)
const terrainData = [];
for (let y = 0; y < WORLD_HEIGHT; y++) {
  terrainData[y] = [];
  for (let x = 0; x < WORLD_WIDTH; x++) {
    const nx = x / WORLD_WIDTH, ny = y / WORLD_HEIGHT;
    const elevation = fbm(nx*4+0.5, ny*4+0.5, 6, 2.0, 0.5);
    const moisture = fbm(nx*3+10.7, ny*3+10.7, 5, 2.0, 0.5);
    const biome = getBiome(elevation, moisture);
    const h = hashCell(x, y, 42);
    let hasTree = false, treeType = 'oak';
    if (biome === 'dense_forest') hasTree = h < 0.8;
    else if (biome === 'forest') hasTree = h < 0.6;
    else if (biome === 'grass') hasTree = h < 0.1;
    else if (biome === 'mountain_base') hasTree = h < 0.2;
    else if (biome === 'swamp') hasTree = h < 0.3;
    if (hasTree) {
      const h2 = hashCell(x+1000, y+1000, 42);
      treeType = h2 < 0.5 ? 'oak' : h2 < 0.8 ? 'pine' : 'birch';
      if (biome === 'mountain_base') treeType = 'pine';
      if (biome === 'swamp') treeType = 'oak';
    }
    let hasRock = false;
    if (biome === 'mountain') hasRock = h < 0.5;
    else if (biome === 'mountain_base') hasRock = hashCell(x+500, y+500, 42) < 0.3;
    else if (biome === 'grass') hasRock = hashCell(x+500, y+500, 42) < 0.05;
    terrainData[y][x] = { type: biome, hasTree, treeType, hasRock, stump: false };
  }
}
</script>
<script>
// ============================================================================
// CLIENT — Canvas, Camera, Terrain Cache, Rendering
// ============================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');

let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

// Camera
let camX = WORLD_WIDTH * TILE_SIZE / 2 - W / 2;
let camY = WORLD_HEIGHT * TILE_SIZE / 2 - H / 2;
let camTargetX = camX, camTargetY = camY;
let zoom = 1.0;
let dragging = false, dragStartX = 0, dragStartY = 0, dragCamX = 0, dragCamY = 0;
let followAgent = null;

// Terrain cache (offscreen canvas)
const terrainCache = document.createElement('canvas');
terrainCache.width = WORLD_WIDTH * TILE_SIZE;
terrainCache.height = WORLD_HEIGHT * TILE_SIZE;
const tCtx = terrainCache.getContext('2d');

function renderTerrainCache() {
  for (let y = 0; y < WORLD_HEIGHT; y++) {
    for (let x = 0; x < WORLD_WIDTH; x++) {
      const cell = terrainData[y][x];
      const colors = BIOME_COLORS[cell.type] || BIOME_COLORS.grass;
      tCtx.fillStyle = (x + y) % 2 === 0 ? colors[0] : colors[1];
      tCtx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
    }
  }
}
renderTerrainCache();

// Minimap cache
function renderMinimap() {
  const mw = minimapCanvas.width, mh = minimapCanvas.height;
  const sx = mw / WORLD_WIDTH, sy = mh / WORLD_HEIGHT;
  minimapCtx.clearRect(0, 0, mw, mh);
  // Draw terrain at minimap scale
  for (let y = 0; y < WORLD_HEIGHT; y += 2) {
    for (let x = 0; x < WORLD_WIDTH; x += 2) {
      const colors = BIOME_COLORS[terrainData[y][x].type] || BIOME_COLORS.grass;
      minimapCtx.fillStyle = colors[0];
      minimapCtx.fillRect(x * sx, y * sy, sx * 2 + 1, sy * 2 + 1);
    }
  }
}
renderMinimap();

// State from server
let serverState = null;
let renderEntities = { agents: [], buildings: [], animals: [], settlements: [], clans: [] };
let particles = [];
let floatingTexts = [];
let selectedAgent = null;
let bannerTimer = 0;
let lastBannerText = '';

// Interpolated positions
const interpPos = {};

// ============================================================================
// Drawing Helpers
// ============================================================================

function drawTree(x, y, type, wobble) {
  const w = wobble || 0;
  ctx.save();
  ctx.translate(x, y);
  if (w) ctx.rotate(w);
  if (type === 'pine') {
    ctx.fillStyle = '#2d5016'; ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(-7, -4); ctx.lineTo(7, -4); ctx.fill();
    ctx.fillStyle = '#3a6620'; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-9, 2); ctx.lineTo(9, 2); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(-2, 2, 4, 6);
  } else if (type === 'birch') {
    ctx.fillStyle = '#6aaa3a'; ctx.beginPath(); ctx.arc(0, -10, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#80cc50'; ctx.beginPath(); ctx.arc(-2, -12, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8e0d0'; ctx.fillRect(-1.5, -2, 3, 10);
  } else { // oak
    ctx.fillStyle = '#2e6e1a'; ctx.beginPath(); ctx.arc(0, -10, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a8a28'; ctx.beginPath(); ctx.arc(-2, -12, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(-2, -2, 4, 8);
  }
  ctx.restore();
}

function drawStump(x, y) {
  ctx.fillStyle = '#5a3a1a'; ctx.fillRect(x - 3, y - 2, 6, 5);
  ctx.fillStyle = '#7a5a2a'; ctx.fillRect(x - 2, y - 2, 4, 1);
}

function drawRock(x, y) {
  ctx.fillStyle = '#8a8a7a';
  ctx.beginPath(); ctx.moveTo(x-5, y+3); ctx.lineTo(x-4, y-4); ctx.lineTo(x+2, y-5); ctx.lineTo(x+6, y-1); ctx.lineTo(x+4, y+3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9a9a8a';
  ctx.beginPath(); ctx.moveTo(x-3, y-2); ctx.lineTo(x+1, y-4); ctx.lineTo(x+4, y-1); ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
}

const RACE_COLORS = { human: '#c88050', dwarf: '#a07040', elf: '#90c890', orc: '#60a060' };
const PERSONALITY_HAT = { analyst: '#4488cc', optimist: '#ffcc33', dreamer: '#cc88ff', overachiever: '#ff4444', aggressive: '#cc2222', chaotic: '#ff66ff', grinder: '#888888', lazy: '#66aaaa' };

function drawAgent(agent, rx, ry) {
  const knock = agent.knockedOut;
  ctx.save();
  ctx.translate(rx, ry);
  if (knock) { ctx.rotate(Math.PI / 2); ctx.globalAlpha = 0.5; }
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 10, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
  // Body
  const bodyColor = RACE_COLORS[agent.race] || '#c88050';
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-5, -8, 10, 14);
  // Head
  const skinColor = agent.race === 'orc' ? '#5a9a4a' : agent.race === 'elf' ? '#e8d8b8' : '#e0b888';
  ctx.fillStyle = skinColor;
  ctx.fillRect(-4, -16, 8, 8);
  // Eyes
  ctx.fillStyle = '#222';
  if (agent.facing === 'right') { ctx.fillRect(0, -14, 2, 2); ctx.fillRect(3, -14, 2, 2); }
  else { ctx.fillRect(-5, -14, 2, 2); ctx.fillRect(-2, -14, 2, 2); }
  // Hat
  ctx.fillStyle = PERSONALITY_HAT[agent.personality] || '#666';
  ctx.fillRect(-5, -19, 10, 3);
  // Legs (walk animation)
  const walk = agent.currentTask === 'idle' || agent.currentTask === 'rest' ? 0 : Math.sin(agent.animFrame * 0.2) * 3;
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-4, 6, 3, 5 + walk);
  ctx.fillRect(1, 6, 3, 5 - walk);
  // Tool based on task
  if (agent.currentTask === 'chop') { ctx.fillStyle = '#888'; ctx.fillRect(6, -10, 2, 12); ctx.fillStyle = '#aaa'; ctx.fillRect(5, -12, 4, 4); }
  else if (agent.currentTask === 'mine') { ctx.fillStyle = '#888'; ctx.fillRect(6, -8, 2, 10); ctx.fillStyle = '#aaa'; ctx.fillRect(4, -10, 6, 3); }
  else if (agent.currentTask === 'build') { ctx.fillStyle = '#aa8844'; ctx.fillRect(6, -6, 2, 10); ctx.fillStyle = '#888'; ctx.fillRect(5, -8, 4, 3); }
  // Health bar if damaged
  if (agent.health < 100 && !knock) {
    ctx.fillStyle = '#333'; ctx.fillRect(-8, -24, 16, 3);
    ctx.fillStyle = agent.health > 50 ? '#4a4' : agent.health > 25 ? '#aa4' : '#a44';
    ctx.fillRect(-8, -24, 16 * (agent.health / 100), 3);
  }
  ctx.restore();
  // Name tag
  if (!knock) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.font = '9px monospace';
    const tw = ctx.measureText(agent.name).width;
    ctx.fillRect(rx - tw/2 - 2, ry - 30, tw + 4, 12);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(agent.name, rx, ry - 20);
    ctx.textAlign = 'left';
  }
}

function drawBuilding(bld, rx, ry) {
  const s = TILE_SIZE;
  ctx.save();
  ctx.translate(rx, ry);
  const pct = bld.complete ? 1 : bld.progress / bld.constructionTime;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(s/2, s + 2, s * 0.7, 4, 0, 0, Math.PI * 2); ctx.fill();

  if (!bld.complete) {
    // 4-stage construction animation
    ctx.globalAlpha = 0.5 + pct * 0.5;
    if (pct <= 0.25) {
      // Stage 1: Foundation/platform only
      ctx.fillStyle = '#8a7a5a';
      ctx.fillRect(0, s * 0.7, s, s * 0.3);
      ctx.fillStyle = '#7a6a4a';
      ctx.fillRect(1, s * 0.75, s - 2, s * 0.1);
    } else if (pct <= 0.50) {
      // Stage 2: Walls at half height + scaffolding poles
      ctx.fillStyle = '#8a7a5a'; ctx.fillRect(0, s * 0.7, s, s * 0.3);
      ctx.fillStyle = '#a09070'; ctx.fillRect(0, s * 0.4, s, s * 0.3);
      ctx.strokeStyle = '#aa8844'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, s * 0.1); ctx.lineTo(0, s); ctx.moveTo(s, s * 0.1); ctx.lineTo(s, s); ctx.stroke();
    } else if (pct <= 0.75) {
      // Stage 3: Full walls, no roof, scaffolding
      ctx.fillStyle = '#8a7a5a'; ctx.fillRect(0, s * 0.7, s, s * 0.3);
      ctx.fillStyle = '#a09070'; ctx.fillRect(0, s * 0.15, s, s * 0.85);
      ctx.fillStyle = '#5a3a1a'; ctx.fillRect(s/2 - 2, s * 0.5, 4, s * 0.5);
      ctx.strokeStyle = '#aa8844'; ctx.lineWidth = 1;
      ctx.strokeRect(-2, s * 0.1, s + 4, s * 0.8);
      ctx.beginPath(); ctx.moveTo(s/2, s*0.1); ctx.lineTo(s/2, -4); ctx.stroke();
    } else {
      // Stage 4: Roof appearing, scaffolding still visible
      ctx.fillStyle = '#8a7a5a'; ctx.fillRect(0, s * 0.7, s, s * 0.3);
      ctx.fillStyle = '#a09070'; ctx.fillRect(0, s * 0.15, s, s * 0.85);
      ctx.fillStyle = '#5a3a1a'; ctx.fillRect(s/2 - 2, s * 0.5, 4, s * 0.5);
      const roofPct = (pct - 0.75) / 0.25;
      ctx.fillStyle = '#885533';
      ctx.beginPath(); ctx.moveTo(-1, s * 0.15); ctx.lineTo(s/2, s * 0.15 - 10 * roofPct); ctx.lineTo(s + 1, s * 0.15); ctx.fill();
      // Fading scaffolding
      ctx.globalAlpha *= (1 - roofPct * 0.7);
      ctx.strokeStyle = '#aa8844'; ctx.lineWidth = 1;
      ctx.strokeRect(-2, s * 0.1, s + 4, s * 0.8);
      ctx.globalAlpha = 0.5 + pct * 0.5;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  // Complete buildings by type
  const t = bld.type;
  if (t === 'Campfire') {
    ctx.fillStyle = '#5a3a1a';
    for (let i = 0; i < 5; i++) { const a = (i/5)*Math.PI*2; ctx.fillRect(s/2+Math.cos(a)*5-1, s/2+Math.sin(a)*5-1, 3, 3); }
    ctx.fillStyle = '#ff6622';
    ctx.beginPath(); ctx.moveTo(s/2, s/2-6); ctx.lineTo(s/2-4, s/2+2); ctx.lineTo(s/2+4, s/2+2); ctx.fill();
    ctx.fillStyle = '#ffaa22';
    ctx.beginPath(); ctx.moveTo(s/2, s/2-3); ctx.lineTo(s/2-2, s/2+1); ctx.lineTo(s/2+2, s/2+1); ctx.fill();
  } else if (t === 'Wood Hut') {
    ctx.fillStyle = '#8a6a3a'; ctx.fillRect(1, 4, s-2, s-4); // front
    ctx.fillStyle = '#6a5030'; ctx.fillRect(s-4, 4, 4, s-4); // side
    ctx.fillStyle = '#a05020'; // roof
    ctx.beginPath(); ctx.moveTo(-1, 4); ctx.lineTo(s/2, -4); ctx.lineTo(s+1, 4); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(s/2-2, 8, 4, s-8); // door
  } else if (t === 'Log Cabin') {
    ctx.fillStyle = '#7a5a2a'; ctx.fillRect(0, 3, s, s-3);
    ctx.fillStyle = '#5a4020'; ctx.fillRect(s-3, 3, 3, s-3);
    ctx.fillStyle = '#8a3020'; ctx.beginPath(); ctx.moveTo(-2, 3); ctx.lineTo(s/2, -5); ctx.lineTo(s+2, 3); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(s/2-2, 7, 5, s-7);
    ctx.fillStyle = '#aaccee'; ctx.fillRect(2, 5, 3, 3); ctx.fillRect(s-7, 5, 3, 3);
  } else if (t === 'Farm') {
    ctx.fillStyle = '#6a5030'; ctx.fillRect(2, 6, s-4, s-6);
    ctx.fillStyle = '#aa8840'; ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(s/2, 0); ctx.lineTo(s, 6); ctx.fill();
    // Field rows
    ctx.fillStyle = '#5a3a1a'; for (let i = 0; i < 3; i++) ctx.fillRect(-4, s+4+i*4, s+8, 2);
    ctx.fillStyle = '#4a8a2a'; for (let i = 0; i < 3; i++) { for (let j = 0; j < 4; j++) ctx.fillRect(-2+j*5, s+2+i*4, 3, 3); }
  } else if (t === 'Lumber Mill') {
    ctx.fillStyle = '#6a5030'; ctx.fillRect(0, 2, s, s-2);
    ctx.fillStyle = '#5a4020'; ctx.fillRect(s-3, 2, 3, s-2);
    ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(s/2, s/2, 4, 0, Math.PI*2); ctx.fill(); // saw
    ctx.fillStyle = '#aaa'; ctx.fillRect(s/2-1, s/2-5, 2, 5);
  } else if (t === 'Stone House') {
    ctx.fillStyle = '#9a9a8a'; ctx.fillRect(0, 3, s, s-3);
    ctx.fillStyle = '#7a7a6a'; ctx.fillRect(s-3, 3, 3, s-3);
    ctx.fillStyle = '#6a4a2a'; ctx.beginPath(); ctx.moveTo(-1, 3); ctx.lineTo(s/2, -4); ctx.lineTo(s+1, 3); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(s/2-2, 7, 4, s-7);
    ctx.fillStyle = '#aaccee'; ctx.fillRect(2, 5, 3, 3); ctx.fillRect(s-7, 5, 3, 3);
  } else if (t === 'Blacksmith') {
    ctx.fillStyle = '#5a5a5a'; ctx.fillRect(0, 2, s, s-2);
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(s-3, 2, 3, s-2);
    ctx.fillStyle = '#ff6622'; ctx.fillRect(2, s-5, 4, 3); // forge glow
    ctx.fillStyle = '#888'; ctx.fillRect(s-6, 4, 4, 4); // anvil
  } else if (t === 'Watchtower') {
    ctx.fillStyle = '#7a7a6a'; ctx.fillRect(s/2-4, -8, 8, s+8);
    ctx.fillStyle = '#6a6a5a'; ctx.fillRect(s/2-6, -10, 12, 4);
    ctx.fillStyle = '#aa3333'; ctx.fillRect(s/2-1, -14, 2, 4); // flag
  } else if (t === 'Well') {
    ctx.fillStyle = '#7a7a6a'; ctx.beginPath(); ctx.arc(s/2, s/2, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4488aa'; ctx.beginPath(); ctx.arc(s/2, s/2, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(s/2-5, s/2-6, 1, 6); ctx.fillRect(s/2+4, s/2-6, 1, 6);
    ctx.fillRect(s/2-5, s/2-6, 10, 1);
  } else if (t === 'Town Hall') {
    ctx.fillStyle = '#b0a080'; ctx.fillRect(-2, 2, s+4, s+2);
    ctx.fillStyle = '#8a7a5a'; ctx.fillRect(s, 2, 4, s+2);
    ctx.fillStyle = '#6a4a2a'; ctx.beginPath(); ctx.moveTo(-4, 2); ctx.lineTo(s/2, -8); ctx.lineTo(s+4, 2); ctx.fill();
    ctx.fillStyle = '#ffd700'; ctx.fillRect(s/2-1, -10, 2, 4);
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(s/2-3, 6, 6, s-4);
  } else if (t === 'Church') {
    ctx.fillStyle = '#c0b090'; ctx.fillRect(1, 4, s-2, s-4);
    ctx.fillStyle = '#a09070'; ctx.fillRect(s-3, 4, 3, s-4);
    ctx.fillStyle = '#7a5a3a'; ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(s/2, -6); ctx.lineTo(s, 4); ctx.fill();
    ctx.fillStyle = '#ffd700'; ctx.fillRect(s/2-1, -10, 2, 6);
    ctx.fillRect(s/2-3, -8, 6, 2);
  } else if (t === 'Market') {
    ctx.fillStyle = '#cc8844'; ctx.fillRect(0, 4, s, s-4);
    ctx.fillStyle = '#ff8844'; ctx.beginPath(); ctx.moveTo(-2, 4); ctx.lineTo(s/2, -2); ctx.lineTo(s+2, 4); ctx.fill();
    ctx.fillStyle = '#4a4'; ctx.fillRect(2, 8, 3, 3); ctx.fillStyle = '#a44'; ctx.fillRect(6, 8, 3, 3);
  } else if (t === 'Barracks') {
    ctx.fillStyle = '#6a6a6a'; ctx.fillRect(0, 2, s, s-2);
    ctx.fillStyle = '#5a5a5a'; ctx.fillRect(s-3, 2, 3, s-2);
    ctx.fillStyle = '#884422'; ctx.beginPath(); ctx.moveTo(-1, 2); ctx.lineTo(s/2, -4); ctx.lineTo(s+1, 2); ctx.fill();
    ctx.fillStyle = '#aa3333'; ctx.fillRect(s-4, -2, 2, 6);
  } else {
    // Generic building
    ctx.fillStyle = '#8a7a6a'; ctx.fillRect(0, 3, s, s-3);
    ctx.fillStyle = '#6a5a4a'; ctx.fillRect(s-3, 3, 3, s-3);
    ctx.fillStyle = '#5a3a2a'; ctx.beginPath(); ctx.moveTo(-1, 3); ctx.lineTo(s/2, -4); ctx.lineTo(s+1, 3); ctx.fill();
  }
  ctx.restore();
}

function drawAnimal(animal, rx, ry) {
  ctx.save();
  ctx.translate(rx, ry);
  if (animal.type === 'deer') {
    ctx.fillStyle = '#a07040'; ctx.fillRect(-5, -3, 10, 6); // body
    ctx.fillStyle = '#8a6030'; ctx.fillRect(-7, -6, 4, 5); // head
    ctx.fillStyle = '#5a3a1a'; // legs
    ctx.fillRect(-4, 3, 2, 4); ctx.fillRect(2, 3, 2, 4);
    ctx.fillStyle = '#6a5020'; ctx.fillRect(-8, -10, 1, 5); ctx.fillRect(-6, -10, 1, 5); // antlers
  } else if (animal.type === 'rabbit') {
    ctx.fillStyle = '#c0a888'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d0b898'; ctx.beginPath(); ctx.ellipse(-3, -3, 2, 1.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d0b898'; ctx.fillRect(-4, -7, 2, 4); ctx.fillRect(-1, -7, 2, 4); // ears
  } else if (animal.type === 'chicken') {
    ctx.fillStyle = '#f0e0c0'; ctx.beginPath(); ctx.ellipse(0, 0, 3, 2.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e0c0a0'; ctx.beginPath(); ctx.arc(-3, -2, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#cc3300'; ctx.fillRect(-4, -4, 2, 2); // comb
    ctx.fillStyle = '#ff8800'; ctx.fillRect(-5, -2, 2, 1); // beak
  } else if (animal.type === 'wolf') {
    ctx.fillStyle = '#606060'; ctx.fillRect(-6, -3, 12, 6);
    ctx.fillStyle = '#505050'; ctx.fillRect(-8, -6, 5, 5);
    ctx.fillStyle = '#404040';
    ctx.fillRect(-5, 3, 2, 4); ctx.fillRect(3, 3, 2, 4);
    ctx.fillStyle = '#aa3333'; ctx.fillRect(-7, -8, 2, 3); ctx.fillRect(-4, -8, 2, 3); // ears
  } else if (animal.type === 'fish') {
    // Fish: jump animation when jumpTimer is low
    const jumping = animal.jumpTimer < 20;
    const jumpY = jumping ? -Math.sin((20 - animal.jumpTimer) / 20 * Math.PI) * 8 : 0;
    ctx.translate(0, jumpY);
    ctx.globalAlpha = jumping ? 1 : 0.6;
    ctx.fillStyle = '#6699bb';
    ctx.beginPath(); ctx.ellipse(0, 0, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5588aa'; // tail
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(7, -2); ctx.lineTo(7, 2); ctx.closePath(); ctx.fill();
    if (jumping) {
      // Splash droplets
      ctx.fillStyle = 'rgba(150,200,255,0.5)';
      ctx.fillRect(-2, 3, 1, 2); ctx.fillRect(1, 4, 1, 2); ctx.fillRect(-4, 2, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

<script>
// ============================================================================
// CLIENT — WebSocket, Input, Main Loop, UI
// ============================================================================

// ---- WebSocket Connection ----
let ws = null;
let connected = false;
let spectatorPoints = 0;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => {
    connected = true;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('reconnect').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    resize();
  };
  ws.onclose = () => {
    connected = false;
    document.getElementById('reconnect').style.display = 'flex';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        serverState = msg;
        // Apply terrain modifications
        if (msg.terrainMods) {
          for (const mod of msg.terrainMods) {
            if (terrainData[mod.y] && terrainData[mod.y][mod.x]) {
              if (mod.hasTree !== undefined) terrainData[mod.y][mod.x].hasTree = mod.hasTree;
              if (mod.hasRock !== undefined) terrainData[mod.y][mod.x].hasRock = mod.hasRock;
              if (mod.stump !== undefined) terrainData[mod.y][mod.x].stump = mod.stump;
            }
          }
        }
        updateUI(msg);
        // Show event banner
        if (msg.activeEvent && msg.activeEvent !== lastBannerText) {
          lastBannerText = msg.activeEvent;
          const banner = document.getElementById('event-banner');
          banner.textContent = msg.activeEvent;
          banner.classList.add('visible');
          bannerTimer = 180;
        }
      } else if (msg.type === 'points_update') {
        spectatorPoints = msg.points;
        document.getElementById('points-display').textContent = msg.points;
      } else if (msg.type === 'error') {
        console.warn('Server:', msg.message);
      }
    } catch (err) { /* ignore */ }
  };
}

// ---- Input Handling ----
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) { dragging = true; dragStartX = e.clientX; dragStartY = e.clientY; dragCamX = camX; dragCamY = camY; canvas.style.cursor = 'grabbing'; followAgent = null; }
});
window.addEventListener('mousemove', (e) => {
  if (dragging) {
    camX = dragCamX - (e.clientX - dragStartX) / zoom;
    camY = dragCamY - (e.clientY - dragStartY) / zoom;
  }
});
window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const oldZoom = zoom;
  zoom *= e.deltaY < 0 ? 1.1 : 0.9;
  zoom = Math.max(0.3, Math.min(3, zoom));
  // Zoom toward mouse position
  const mx = e.clientX, my = e.clientY - 40;
  camX += mx / oldZoom - mx / zoom;
  camY += my / oldZoom - my / zoom;
}, { passive: false });

canvas.addEventListener('dblclick', (e) => {
  if (!serverState) return;
  const wx = camX + e.clientX / zoom;
  const wy = camY + (e.clientY - 40) / zoom;
  // Find closest agent
  let closest = null, minD = 60;
  for (const a of serverState.agents) {
    const d = Math.abs(a.x - wx) + Math.abs(a.y - wy);
    if (d < minD) { minD = d; closest = a; }
  }
  if (closest) followAgent = closest.name;
});

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);

// ---- Agent Detail Panel ----
function showAgentDetail(name) {
  const panel = document.getElementById('agent-detail');
  panel.style.display = 'block';
}
function updateAgentDetail() {
  if (!selectedAgent || !serverState) return;
  const a = serverState.agents.find(ag => ag.name === selectedAgent);
  if (!a) { document.getElementById('agent-detail').style.display = 'none'; return; }
  document.getElementById('detail-name').textContent = a.name + ' (' + a.race + ' ' + a.personality + ')';
  const TASK_ICONS = { idle: 'Idle', chop: 'Chopping', mine: 'Mining', forage: 'Foraging', build: 'Building', rest: 'Resting', explore: 'Exploring', socialize: 'Chatting', fight: 'Fighting!', flee: 'Fleeing!' };
  document.getElementById('detail-info').innerHTML = 'Task: <b>' + (TASK_ICONS[a.currentTask] || a.currentTask) + '</b>' +
    (a.clan ? ' | Clan: ' + ((serverState.clans.find(c => c.id === a.clan) || {}).name || 'Unknown') : '') +
    (a.knockedOut ? ' | <span style="color:#f44">KNOCKED OUT</span>' : '') +
    ' | Kills: ' + a.kills + ' | Built: ' + a.buildingsBuilt;
  const bar = (label, val, max, color) => '<div style="margin:1px 0"><span style="display:inline-block;width:50px">' + label + '</span>' +
    '<span style="display:inline-block;width:100px;height:6px;background:#333;border-radius:2px;vertical-align:middle">' +
    '<span style="display:inline-block;width:' + (val/max*100) + '%;height:100%;background:' + color + ';border-radius:2px"></span></span>' +
    ' <span style="color:#aaa">' + Math.round(val) + '</span></div>';
  document.getElementById('detail-stats').innerHTML =
    bar('HP', a.health, 100, a.health > 50 ? '#4a4' : '#a44') +
    bar('Energy', a.energy, 100, '#48a') +
    bar('Hunger', a.hunger, 100, '#a84') +
    bar('Morale', a.morale, 100, '#aa4');
  document.getElementById('detail-inventory').innerHTML =
    '<span style="color:#8B4513">Wood: ' + a.inventory.wood + '</span> | ' +
    '<span style="color:#888">Stone: ' + a.inventory.stone + '</span> | ' +
    '<span style="color:#ffd700">Gold: ' + (a.inventory.gold || 0) + '</span> | ' +
    '<span style="color:#6a4">Food: ' + a.inventory.food + '</span>' +
    ' | Total: ' + a.totalGathered;
  // Top 3 relationships
  const rels = Object.entries(a.relationships || {}).sort((a,b) => b[1] - a[1]).slice(0, 3);
  document.getElementById('detail-relations').innerHTML = rels.length > 0 ?
    'Relations: ' + rels.map(([n,v]) => n + ': ' + (v > 0 ? '+' : '') + Math.round(v)).join(', ') : '';
}
document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('agent-detail').style.display = 'none';
  selectedAgent = null;
});

// ---- Deploy & Influence Buttons ----
document.getElementById('deploy-btn').addEventListener('click', () => {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'action', type: 'deploy_agent',
    name: document.getElementById('deploy-name').value || undefined,
    race: document.getElementById('deploy-race').value,
    personality: document.getElementById('deploy-personality').value
  }));
});
document.getElementById('btn-food').addEventListener('click', () => {
  if (!ws || ws.readyState !== 1) return;
  const wx = camX + W / (2 * zoom), wy = camY + H / (2 * zoom);
  ws.send(JSON.stringify({ type: 'action', type: 'drop_food', x: wx, y: wy }));
});
document.getElementById('btn-rain').addEventListener('click', () => {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'action', type: 'trigger_rain' }));
});
document.getElementById('btn-speed').addEventListener('click', () => {
  if (!ws || ws.readyState !== 1 || !serverState) return;
  const target = serverState.agents.length > 0 ? serverState.agents[Math.floor(Math.random() * serverState.agents.length)].name : null;
  if (target) ws.send(JSON.stringify({ type: 'action', type: 'speed_boost', target }));
});
document.getElementById('btn-gift').addEventListener('click', () => {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'action', type: 'mystery_gift' }));
});

// ---- UI Update ----
function updateUI(state) {
  document.getElementById('era-display').textContent = state.era.charAt(0).toUpperCase() + state.era.slice(1);
  document.getElementById('pop-display').textContent = state.agents.length;
  document.getElementById('bld-display').textContent = state.buildings.filter(b => b.complete).length;
  document.getElementById('day-display').textContent = state.day;
  document.getElementById('spec-display').textContent = state.spectatorCount;
  document.getElementById('event-display').textContent = state.activeEvent || '';

  // Agent list
  const agentList = document.getElementById('agent-list');
  let agentHtml = '';
  const TASK_ICONS = { idle: 'Idle', chop: 'Chopping', mine: 'Mining', forage: 'Foraging', build: 'Building', rest: 'Resting', explore: 'Exploring', socialize: 'Chatting', fight: 'Fighting!', flee: 'Fleeing!' };
  for (const a of state.agents) {
    const color = a.clan ? (state.clans.find(c => c.id === a.clan) || {}).color || '#888' : RACE_COLORS[a.race] || '#888';
    const task = TASK_ICONS[a.currentTask] || a.currentTask;
    const hpColor = a.health > 50 ? '#4a4' : a.health > 25 ? '#aa4' : '#a44';
    agentHtml += '<div class="agent-item" data-agent="' + a.name + '">' +
      '<span class="agent-dot" style="background:' + color + '"></span>' +
      '<span><span class="agent-name">' + a.name + '</span><br><span class="agent-task">' + task + '</span></span>' +
      '<span class="agent-health-bar"><span class="agent-health-fill" style="width:' + a.health + '%;background:' + hpColor + '"></span></span></div>';
  }
  agentList.innerHTML = agentHtml;
  agentList.querySelectorAll('.agent-item').forEach(el => {
    el.addEventListener('click', () => { followAgent = el.dataset.agent; selectedAgent = el.dataset.agent; showAgentDetail(el.dataset.agent); });
  });

  // Settlement list
  const stlList = document.getElementById('settlement-list');
  stlList.innerHTML = state.settlements.map(s => '<div class="settlement-item">' + s.name + ' (' + s.phase + ', ' + (s.buildingCount||0) + ' bldg)</div>').join('');

  // Clan list
  const clanList = document.getElementById('clan-list');
  clanList.innerHTML = state.clans.map(c => '<div style="color:' + c.color + ';padding:2px 0">' + c.name + ' (' + c.members.length + ' members)</div>').join('');

  // Event feed
  const feed = document.getElementById('event-feed');
  feed.innerHTML = state.recentEvents.map(e => '<div class="event-item">' + e.text + '</div>').join('');

  // Update minimap with agents/buildings
  renderMinimap();
  const mw = minimapCanvas.width, mh = minimapCanvas.height;
  const sx = mw / (WORLD_WIDTH * TILE_SIZE), sy = mh / (WORLD_HEIGHT * TILE_SIZE);
  for (const b of state.buildings) {
    minimapCtx.fillStyle = b.complete ? '#ffd700' : '#886600';
    minimapCtx.fillRect(b.x * TILE_SIZE * sx - 1, b.y * TILE_SIZE * sy - 1, 3, 3);
  }
  for (const a of state.agents) {
    minimapCtx.fillStyle = '#ff4444';
    minimapCtx.fillRect(a.x * sx - 1, a.y * sy - 1, 3, 3);
  }
  // Camera rect
  minimapCtx.strokeStyle = '#fff';
  minimapCtx.lineWidth = 1;
  minimapCtx.strokeRect(camX * sx, camY * sy, W / zoom * sx, H / zoom * sy);

  // Update agent detail panel
  updateAgentDetail();
}

// Minimap click to move camera
minimapCanvas.addEventListener('click', (e) => {
  const rect = minimapCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  camX = (mx / minimapCanvas.width) * WORLD_WIDTH * TILE_SIZE - W / (2 * zoom);
  camY = (my / minimapCanvas.height) * WORLD_HEIGHT * TILE_SIZE - H / (2 * zoom);
  followAgent = null;
});

// ============================================================================
// Main Render Loop
// ============================================================================
let lastFrame = performance.now();

function render(now) {
  requestAnimationFrame(render);
  const dt = Math.min(now - lastFrame, 100);
  lastFrame = now;

  if (!serverState) return;

  // Follow agent
  if (followAgent) {
    const a = serverState.agents.find(ag => ag.name === followAgent);
    if (a) {
      camX += (a.x - W / (2 * zoom) - camX) * 0.05;
      camY += (a.y - H / (2 * zoom) - camY) * 0.05;
    }
  }

  // Clamp camera
  const maxX = WORLD_WIDTH * TILE_SIZE - W / zoom;
  const maxY = WORLD_HEIGHT * TILE_SIZE - H / zoom;
  camX = Math.max(0, Math.min(maxX, camX));
  camY = Math.max(0, Math.min(maxY, camY));

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -camY);

  // Viewport culling
  const vx1 = Math.max(0, Math.floor(camX / TILE_SIZE) - 1);
  const vy1 = Math.max(0, Math.floor(camY / TILE_SIZE) - 1);
  const vx2 = Math.min(WORLD_WIDTH, Math.ceil((camX + W / zoom) / TILE_SIZE) + 1);
  const vy2 = Math.min(WORLD_HEIGHT, Math.ceil((camY + H / zoom) / TILE_SIZE) + 1);

  // 1. Terrain from cache
  ctx.drawImage(terrainCache, 0, 0);

  // 2. Water shimmer
  const shimmerTime = now * 0.001;
  for (let y = vy1; y < vy2; y++) {
    for (let x = vx1; x < vx2; x++) {
      const cell = terrainData[y][x];
      if (cell.type === 'shallow_water' || cell.type === 'deep_water') {
        const shimmer = Math.sin(shimmerTime + x * 0.5 + y * 0.3) * 0.15;
        if (shimmer > 0) {
          ctx.fillStyle = 'rgba(255,255,255,' + (shimmer * 0.3).toFixed(2) + ')';
          ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
      }
      // Ground flowers on grass
      if (cell.type === 'grass' && !cell.hasTree && !cell.hasRock && !cell.stump) {
        const fh = hashCell(x + 200, y + 200, 42);
        if (fh < 0.08) {
          ctx.fillStyle = fh < 0.03 ? '#ee6688' : '#eedd44';
          ctx.fillRect(x * TILE_SIZE + 6, y * TILE_SIZE + 7, 2, 2);
        }
      }
    }
  }

  // 3-5. Collect all Y-sorted entities
  const drawList = [];

  // Stumps
  for (let y = vy1; y < vy2; y++) {
    for (let x = vx1; x < vx2; x++) {
      if (terrainData[y][x].stump) {
        drawList.push({ type: 'stump', y: y * TILE_SIZE + TILE_SIZE, x: x * TILE_SIZE + TILE_SIZE / 2, gx: x, gy: y });
      }
    }
  }

  // Trees
  for (let y = vy1; y < vy2; y++) {
    for (let x = vx1; x < vx2; x++) {
      if (terrainData[y][x].hasTree) {
        // Check if being chopped
        let wobble = 0;
        if (serverState) {
          for (const a of serverState.agents) {
            if (a.currentTask === 'chop' && a.taskTimer > 0) {
              const tx = Math.floor(a.targetX / TILE_SIZE) || -1;
              const ty = Math.floor(a.targetY / TILE_SIZE) || -1;
              if (tx === x && ty === y) {
                wobble = Math.sin(now * 0.006) * 0.08;
              }
            }
          }
        }
        drawList.push({ type: 'tree', y: y * TILE_SIZE + TILE_SIZE, x: x * TILE_SIZE + TILE_SIZE / 2, treeType: terrainData[y][x].treeType, wobble });
      }
      if (terrainData[y][x].hasRock) {
        drawList.push({ type: 'rock', y: y * TILE_SIZE + TILE_SIZE, x: x * TILE_SIZE + TILE_SIZE / 2, gx: x, gy: y });
      }
    }
  }

  // Buildings
  for (const b of serverState.buildings) {
    if (b.x >= vx1 && b.x <= vx2 && b.y >= vy1 && b.y <= vy2) {
      drawList.push({ type: 'building', y: b.y * TILE_SIZE + TILE_SIZE, x: b.x * TILE_SIZE, data: b });
    }
  }

  // Animals
  for (const a of serverState.animals) {
    const gx = a.x / TILE_SIZE, gy = a.y / TILE_SIZE;
    if (gx >= vx1 && gx <= vx2 && gy >= vy1 && gy <= vy2) {
      // Interpolation
      const key = 'animal_' + a.type + '_' + Math.round(a.x / 50) + '_' + Math.round(a.y / 50);
      if (!interpPos[key]) interpPos[key] = { x: a.x, y: a.y };
      interpPos[key].x += (a.x - interpPos[key].x) * 0.1;
      interpPos[key].y += (a.y - interpPos[key].y) * 0.1;
      drawList.push({ type: 'animal', y: interpPos[key].y, x: interpPos[key].x, data: a, rx: interpPos[key].x, ry: interpPos[key].y });
    }
  }

  // Agents
  for (const a of serverState.agents) {
    const gx = a.x / TILE_SIZE, gy = a.y / TILE_SIZE;
    if (gx >= vx1 - 2 && gx <= vx2 + 2 && gy >= vy1 - 2 && gy <= vy2 + 2) {
      if (!interpPos[a.name]) interpPos[a.name] = { x: a.x, y: a.y };
      interpPos[a.name].x += (a.x - interpPos[a.name].x) * 0.1;
      interpPos[a.name].y += (a.y - interpPos[a.name].y) * 0.1;
      drawList.push({ type: 'agent', y: interpPos[a.name].y, x: interpPos[a.name].x, data: a, rx: interpPos[a.name].x, ry: interpPos[a.name].y });
    }
  }

  // Sort by Y
  drawList.sort((a, b) => a.y - b.y);

  // Draw all entities
  for (const item of drawList) {
    switch (item.type) {
      case 'stump': drawStump(item.x, item.y - 4); break;
      case 'tree': drawTree(item.x, item.y, item.treeType, item.wobble); break;
      case 'rock': drawRock(item.x, item.y - 4); break;
      case 'building': drawBuilding(item.data, item.x, item.y - TILE_SIZE); break;
      case 'animal': drawAnimal(item.data, item.rx, item.ry); break;
      case 'agent': drawAgent(item.data, item.rx, item.ry); break;
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1, p.y - 1, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  // Generate chop/mine particles
  if (serverState) {
    for (const a of serverState.agents) {
      if (a.currentTask === 'chop' && a.taskTimer > 0 && Math.random() < 0.15) {
        const ip = interpPos[a.name];
        if (ip) {
          particles.push({ x: ip.x, y: ip.y - 10, vx: (Math.random()-0.5)*2, vy: -Math.random()*2, life: 20, maxLife: 20, color: '#8B4513', size: 2 });
        }
      }
      if (a.currentTask === 'mine' && a.taskTimer > 0 && Math.random() < 0.12) {
        const ip = interpPos[a.name];
        if (ip) {
          particles.push({ x: ip.x, y: ip.y - 10, vx: (Math.random()-0.5)*2, vy: -Math.random()*2, life: 15, maxLife: 15, color: '#ffcc00', size: 2 });
        }
      }
      if (a.currentTask === 'fight' && Math.random() < 0.2) {
        const ip = interpPos[a.name];
        if (ip) {
          particles.push({ x: ip.x, y: ip.y - 5, vx: (Math.random()-0.5)*3, vy: -Math.random()*2, life: 12, maxLife: 12, color: '#ff3333', size: 3 });
          // Dust cloud
          particles.push({ x: ip.x + (Math.random()-0.5)*10, y: ip.y + 5, vx: (Math.random()-0.5)*1, vy: -0.5, life: 18, maxLife: 18, color: '#aa9977', size: 3 });
        }
      }
      // Red flash behind fighting agents
      if (a.currentTask === 'fight') {
        const ip = interpPos[a.name];
        if (ip) {
          ctx.fillStyle = 'rgba(255,50,50,' + (0.15 + Math.sin(now * 0.01) * 0.1).toFixed(2) + ')';
          ctx.beginPath(); ctx.arc(ip.x, ip.y, 20, 0, Math.PI * 2); ctx.fill();
        }
      }
      // Track health for floating damage numbers
      if (!a._prevHealth) a._prevHealth = a.health;
      if (a.health < a._prevHealth) {
        const ip = interpPos[a.name];
        if (ip) {
          const dmg = Math.round(a._prevHealth - a.health);
          floatingTexts.push({ x: ip.x, y: ip.y - 25, text: '-' + dmg, color: '#ff4444', life: 40, maxLife: 40 });
        }
      }
      a._prevHealth = a.health;
    }
  }

  // Floating damage numbers
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.5;
    ft.life--;
    if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
    ctx.globalAlpha = ft.life / ft.maxLife;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Day/night overlay
  if (serverState) {
    const tod = serverState.timeOfDay;
    let overlayAlpha = 0;
    let overlayColor = '0,0,30';
    if (tod < 0.20 || tod > 0.80) {
      // Night
      overlayAlpha = 0.4;
      overlayColor = '0,0,30';
    } else if (tod < 0.30) {
      // Dawn
      const t = (tod - 0.20) / 0.10;
      overlayAlpha = 0.4 * (1 - t);
      overlayColor = Math.floor(40 * (1-t)) + ',' + Math.floor(20 * (1-t)) + ',0';
    } else if (tod > 0.70) {
      // Dusk
      const t = (tod - 0.70) / 0.10;
      overlayAlpha = 0.4 * t;
      overlayColor = Math.floor(40 * t) + ',' + Math.floor(10 * t) + ',' + Math.floor(30 * t);
    }
    if (overlayAlpha > 0.01) {
      ctx.fillStyle = 'rgba(' + overlayColor + ',' + overlayAlpha.toFixed(2) + ')';
      ctx.fillRect(camX, camY, W / zoom, H / zoom);
    }

    // Building window glow at night
    if (tod > 0.75 || tod < 0.25) {
      for (const b of serverState.buildings) {
        if (b.complete && b.x >= vx1 && b.x <= vx2 && b.y >= vy1 && b.y <= vy2) {
          if (['Wood Hut','Log Cabin','Stone House','Town Hall','Blacksmith','Barracks','Church'].includes(b.type)) {
            ctx.fillStyle = 'rgba(255,220,100,0.6)';
            ctx.fillRect(b.x * TILE_SIZE + 3, b.y * TILE_SIZE + 5, 3, 3);
            ctx.fillRect(b.x * TILE_SIZE + TILE_SIZE - 8, b.y * TILE_SIZE + 5, 3, 3);
          }
        }
      }
    }
  }

  ctx.restore();

  // Event banner
  if (bannerTimer > 0) {
    bannerTimer--;
    if (bannerTimer <= 0) {
      document.getElementById('event-banner').classList.remove('visible');
      lastBannerText = '';
    }
  }
}

// ---- Start ----
connect();
requestAnimationFrame(render);
</script>
</body>
</html>
