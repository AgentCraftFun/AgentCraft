<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCraft</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#e0e0e0;font-family:'Courier New',monospace;overflow:hidden}
#loading{position:fixed;inset:0;background:#0a0a14;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
#loading h1{color:#f0c040;font-size:32px;margin-bottom:16px;letter-spacing:4px}
#loading p{color:#888;font-size:14px}
#loading .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#f0c040;border-radius:50%;animation:spin 1s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}
#reconnect{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column}
#reconnect h2{color:#ff6b6b;margin-bottom:10px}
#game-container{display:none;width:100vw;height:100vh;position:relative}
#gameCanvas{position:absolute;top:0;left:0;cursor:grab;image-rendering:pixelated}
#sidebar{position:absolute;top:0;right:0;width:280px;height:100vh;background:#111118;border-left:2px solid #252530;overflow-y:auto;z-index:10;padding:12px;font-size:12px}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
#topbar{position:absolute;top:0;left:0;right:280px;height:36px;background:#0a0a14;border-bottom:2px solid #252530;z-index:10;display:flex;align-items:center;padding:0 16px;gap:16px;font-size:13px}
#topbar .title{color:#f0c040;font-weight:bold;font-size:16px;letter-spacing:2px}
#topbar .stat{color:#777}
#topbar .stat span{color:#ddd;font-weight:bold}
.live-dot{display:inline-block;width:8px;height:8px;background:#ff3333;border-radius:50%;animation:pulse 1.5s ease-in-out infinite;margin-right:4px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#minimap{width:254px;height:200px;border:1px solid #333;margin-bottom:10px;image-rendering:pixelated}
.section-title{color:#f0c040;font-size:12px;font-weight:bold;margin:12px 0 6px;border-bottom:1px solid #252530;padding-bottom:3px;text-transform:uppercase;letter-spacing:1px}
.agent-item{padding:5px 6px;margin:2px 0;border-radius:3px;background:rgba(255,255,255,.03);cursor:pointer;display:flex;align-items:center;gap:6px}
.agent-item:hover{background:rgba(255,255,255,.08)}
.agent-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}
.agent-name{font-weight:bold;color:#ddd;font-size:12px}
.agent-task{color:#777;font-size:10px}
.agent-health-bar{width:40px;height:4px;background:#1a1a24;border-radius:2px;margin-left:auto}
.agent-health-fill{height:100%;border-radius:2px;transition:width .3s}
.settlement-item{padding:4px 6px;margin:2px 0;color:#b0c8a0;cursor:pointer}
.event-item{padding:3px 0;color:#666;font-size:11px;border-bottom:1px solid rgba(255,255,255,.03)}
.event-item:first-child{color:#bbb}
#deploy-panel{margin-top:10px;padding:8px;background:rgba(255,255,255,.03);border-radius:4px;border:1px solid #252530}
#deploy-panel input,#deploy-panel select{width:100%;padding:5px 6px;margin:3px 0;background:#0a0a14;color:#e0e0e0;border:1px solid #333;border-radius:3px;font-family:inherit;font-size:12px}
#deploy-panel button,.influence-btn{width:100%;padding:7px;margin:3px 0;background:#1a3a2a;color:#7fdbca;border:1px solid #2a5a4a;border-radius:3px;cursor:pointer;font-family:inherit;font-size:12px}
#deploy-panel button:hover,.influence-btn:hover{background:#2a5a4a}
.influence-btn{background:#1a1a2e;color:#99a;border-color:#333}
.points-display{color:#ffd700;font-weight:bold;text-align:center;margin:6px 0;font-size:13px}
.event-banner{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(10,10,20,.95);border:2px solid #f0c040;border-radius:6px;padding:10px 24px;color:#f0c040;font-size:14px;font-weight:bold;z-index:20;pointer-events:none;opacity:0;transition:opacity .5s}
.event-banner.visible{opacity:1}
</style>
</head>
<body>
<div id="loading"><h1>AGENTCRAFT</h1><p>Connecting to the living world...</p><div class="spinner"></div></div>
<div id="reconnect"><h2>Disconnected</h2><p>Reconnecting...</p></div>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<div id="topbar">
<span class="title">AGENTCRAFT</span>
<span class="stat"><span class="live-dot"></span>LIVE</span>
<span class="stat">Era: <span id="era-display">Wood</span></span>
<span class="stat">Pop: <span id="pop-display">0</span></span>
<span class="stat">Buildings: <span id="bld-display">0</span></span>
<span class="stat" id="time-icon-display"></span>
<span class="stat">Day <span id="day-display">1</span></span>
<span class="stat">Spectators: <span id="spec-display">0</span></span>
<span class="stat" id="fps-display" style="margin-left:auto;color:#555"></span>
<span class="stat" id="event-display" style="color:#f0c040"></span>
</div>
<div id="sidebar">
<canvas id="minimap" width="254" height="200"></canvas>
<div id="agent-detail" style="display:none;padding:8px;background:rgba(255,255,255,.04);border-radius:4px;margin-bottom:8px;border:1px solid #252530">
<div style="display:flex;justify-content:space-between;align-items:center">
<span id="detail-name" style="font-weight:bold;color:#f0c040;font-size:13px"></span>
<span id="detail-close" style="cursor:pointer;color:#555;font-size:16px">&times;</span>
</div>
<div id="detail-info" style="font-size:11px;color:#999;margin-top:4px"></div>
<div id="detail-stats" style="font-size:11px;margin-top:4px"></div>
<div id="detail-inventory" style="font-size:11px;margin-top:4px"></div>
<div id="detail-relations" style="font-size:11px;margin-top:4px;color:#666"></div>
</div>
<div class="section-title">Active Agents</div>
<div id="agent-list"></div>
<div class="section-title">Settlements</div>
<div id="settlement-list"></div>
<div class="section-title">Clans</div>
<div id="clan-list"></div>
<div class="section-title">Event Feed</div>
<div id="event-feed"></div>
<div class="section-title">Spectator</div>
<div class="points-display">Points: <span id="points-display">0</span></div>
<div id="deploy-panel">
<input id="deploy-name" placeholder="Agent name" maxlength="16">
<select id="deploy-race"><option value="human">Human</option><option value="dwarf">Dwarf</option><option value="elf">Elf</option><option value="orc">Orc</option></select>
<select id="deploy-personality"><option value="analyst">Analyst</option><option value="optimist">Optimist</option><option value="dreamer">Dreamer</option><option value="overachiever">Overachiever</option><option value="aggressive">Aggressive</option><option value="chaotic">Chaotic</option><option value="grinder">Grinder</option><option value="lazy">Lazy</option></select>
<button id="deploy-btn">Deploy Agent</button>
</div>
<div style="margin-top:6px">
<button class="influence-btn" id="btn-food">Drop Food (10 pts)</button>
<button class="influence-btn" id="btn-rain">Trigger Rain (15 pts)</button>
<button class="influence-btn" id="btn-speed">Speed Boost (20 pts)</button>
<button class="influence-btn" id="btn-gift">Mystery Gift (25 pts)</button>
</div>
</div>
<div class="event-banner" id="event-banner"></div>
</div>

<script>
// === NOISE (identical to server) ===
const WORLD_WIDTH=200,WORLD_HEIGHT=200,TILE_SIZE=16;
function seededRandom(s){let v=s;return function(){v=(v*16807)%2147483647;return(v-1)/2147483646}}
function hashCell(x,y,s){let h=s;h=((h<<5)-h+x)|0;h=((h<<5)-h+y)|0;h=((h<<5)-h+x*31)|0;h=((h<<5)-h+y*17)|0;return((h&0x7fffffff)%10000)/10000}
const PERM=new Uint8Array(512);
(function(){const r=seededRandom(42),p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<512;i++)PERM[i]=p[i&255]})();
function grad2d(h,x,y){const v=h&3;return(v&1?x:-x)+(v&2?y:-y)}
function noise2d(x,y){const X=Math.floor(x)&255,Y=Math.floor(y)&255,xf=x-Math.floor(x),yf=y-Math.floor(y),u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=PERM[X]+Y,b=PERM[X+1]+Y;return .5+.5*(grad2d(PERM[a],xf,yf)*(1-u)*(1-v)+grad2d(PERM[b],xf-1,yf)*u*(1-v)+grad2d(PERM[a+1],xf,yf-1)*(1-u)*v+grad2d(PERM[b+1],xf-1,yf-1)*u*v)}
function fbm(x,y,o,l,g){let s=0,a=1,f=1,m=0;for(let i=0;i<o;i++){s+=noise2d(x*f,y*f)*a;m+=a;a*=g;f*=l}return s/m}
function getBiome(e,m){if(e<.22)return'deep_water';if(e<.3)return'shallow_water';if(e<.33)return'beach';if(e>.85)return'snow';if(e>.75)return'mountain';if(e>.65)return'mountain_base';if(m<.25&&e<.55)return'desert';if(m>.7&&e<.4)return'swamp';if(m>.6)return'dense_forest';if(m>.4)return'forest';return'grass'}

// === TERRAIN DATA ===
// Use FLAT colors per biome - NO checkerboard (that causes diagonal stripes)
const BIOME_COLOR={
  deep_water:'#2858a8',shallow_water:'#3872be',beach:'#d4b896',
  grass:'#459035',forest:'#3a7832',dense_forest:'#2e6828',
  desert:'#d0b088',mountain_base:'#847a72',mountain:'#7a6e68',
  snow:'#e4eef4',swamp:'#385828'
};
const terrainData=[];
for(let y=0;y<WORLD_HEIGHT;y++){terrainData[y]=[];for(let x=0;x<WORLD_WIDTH;x++){
  const nx=x/WORLD_WIDTH,ny=y/WORLD_HEIGHT;
  const elevation=fbm(nx*4+.5,ny*4+.5,6,2,.5);
  const moisture=fbm(nx*3+10.7,ny*3+10.7,5,2,.5);
  const biome=getBiome(elevation,moisture);
  const h=hashCell(x,y,42);
  let hasTree=false,treeType='oak';
  if(biome==='dense_forest')hasTree=h<.8;
  else if(biome==='forest')hasTree=h<.6;
  else if(biome==='grass')hasTree=h<.1;
  else if(biome==='mountain_base')hasTree=h<.2;
  else if(biome==='swamp')hasTree=h<.3;
  if(hasTree){const h2=hashCell(x+1000,y+1000,42);treeType=h2<.5?'oak':h2<.8?'pine':'birch';if(biome==='mountain_base')treeType='pine';if(biome==='swamp')treeType='oak'}
  let hasRock=false;
  if(biome==='mountain')hasRock=h<.5;
  else if(biome==='mountain_base')hasRock=hashCell(x+500,y+500,42)<.3;
  else if(biome==='grass')hasRock=hashCell(x+500,y+500,42)<.05;
  terrainData[y][x]={type:biome,hasTree,treeType,hasRock,stump:false};
}}

// Visual tree thinning: every other tree in dense areas
for(let y=0;y<WORLD_HEIGHT;y++)for(let x=0;x<WORLD_WIDTH;x++){
  const c=terrainData[y][x];
  if(!c.hasTree){c.drawTree=false;continue}
  if(c.type==='dense_forest'){
    // Only draw ~1 in 3 trees
    c.drawTree=((x+y*3)%3===0)||hashCell(x+777,y+777,42)>.7;
  }else if(c.type==='forest'){
    c.drawTree=((x+y*2)%2===0)||hashCell(x+777,y+777,42)>.6;
  }else{
    c.drawTree=true;
  }
}
</script>
<script>
// === CANVAS, CAMERA, TERRAIN CACHE ===
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const minimapCanvas=document.getElementById('minimap'),minimapCtx=minimapCanvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;
canvas.width=W;canvas.height=H;
let camX=WORLD_WIDTH*TILE_SIZE/2-W/2,camY=WORLD_HEIGHT*TILE_SIZE/2-H/2,zoom=1;
let dragging=false,dragSX=0,dragSY=0,dragCX=0,dragCY=0,followAgent=null;

const terrainCache=document.createElement('canvas');
terrainCache.width=WORLD_WIDTH*TILE_SIZE;terrainCache.height=WORLD_HEIGHT*TILE_SIZE;
const tCtx=terrainCache.getContext('2d');
let terrainDirty=true;

function renderTerrainCache(){
  for(let y=0;y<WORLD_HEIGHT;y++)for(let x=0;x<WORLD_WIDTH;x++){
    const c=terrainData[y][x];
    // Flat color per cell — use noise-based subtle variation instead of checkerboard
    const base=BIOME_COLOR[c.type]||'#459035';
    tCtx.fillStyle=base;
    tCtx.fillRect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE);
    // Subtle variation using hash — NOT checkerboard
    const v=hashCell(x+300,y+300,42);
    if(v<.3){tCtx.fillStyle='rgba(0,0,0,0.04)';tCtx.fillRect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE)}
    else if(v>.85){tCtx.fillStyle='rgba(255,255,255,0.03)';tCtx.fillRect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE)}
    // Small grass details
    if(c.type==='grass'&&!c.hasTree&&!c.hasRock){
      const fh=hashCell(x+200,y+200,42);
      if(fh<.03){tCtx.fillStyle='#5aa848';tCtx.fillRect(x*TILE_SIZE+4,y*TILE_SIZE+4,2,2);tCtx.fillRect(x*TILE_SIZE+10,y*TILE_SIZE+9,2,2)}
      if(fh>.97){tCtx.fillStyle='#ee7788';tCtx.fillRect(x*TILE_SIZE+7,y*TILE_SIZE+7,2,2)}
    }
  }
  terrainDirty=false;
}
renderTerrainCache();

// Minimap
const mmCache=document.createElement('canvas');mmCache.width=254;mmCache.height=200;
const mmCtx=mmCache.getContext('2d');
(function(){const sx=254/WORLD_WIDTH,sy=200/WORLD_HEIGHT;
for(let y=0;y<WORLD_HEIGHT;y++)for(let x=0;x<WORLD_WIDTH;x++){
  mmCtx.fillStyle=BIOME_COLOR[terrainData[y][x].type]||'#459035';
  mmCtx.fillRect(x*sx,y*sy,Math.ceil(sx),Math.ceil(sy));
}})();

// State
let serverState=null,particles=[],floatingTexts=[],selectedAgent=null;
let bannerTimer=0,lastBannerText='';
const interpPos={};
let fpsC=0,fpsT=0,fpsD=0;
const RACE_COLORS={human:'#3355aa',dwarf:'#aa6633',elf:'#33aa55',orc:'#aa3333'};

// === DRAW TREE ===
function drawTree(x,y,type,wobble){
  ctx.save();ctx.translate(x,y);
  if(wobble)ctx.rotate(wobble);
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath();ctx.ellipse(2,2,9,4,0,0,Math.PI*2);ctx.fill();
  if(type==='pine'){
    ctx.fillStyle='#4a3520';ctx.fillRect(-1,-2,3,8);
    ctx.fillStyle='#1e6e1e';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(-8,-4);ctx.lineTo(8,-4);ctx.fill();
    ctx.fillStyle='#258a25';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-5,-8);ctx.lineTo(5,-8);ctx.fill();
  }else if(type==='birch'){
    ctx.fillStyle='#ccc0a8';ctx.fillRect(-1,-3,3,9);
    ctx.fillStyle='#888';ctx.fillRect(0,0,1,1);ctx.fillRect(-1,3,1,1);
    ctx.fillStyle='#38a838';ctx.beginPath();ctx.arc(0,-12,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#48c848';ctx.beginPath();ctx.arc(-2,-14,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#60e060';ctx.beginPath();ctx.arc(-3,-16,3,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#4a3520';ctx.fillRect(-2,-3,4,9);
    ctx.fillStyle='#2a8a2a';ctx.beginPath();ctx.arc(0,-12,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#35a835';ctx.beginPath();ctx.arc(-2,-14,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#50c850';ctx.beginPath();ctx.arc(-3,-16,3,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawStump(x,y){
  ctx.fillStyle='rgba(0,0,0,0.1)';ctx.beginPath();ctx.ellipse(x+1,y+1,5,2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a3520';ctx.fillRect(x-3,y-3,6,4);
  ctx.fillStyle='#6a5530';ctx.fillRect(x-2,y-3,4,1);
}
function drawRock(x,y){
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.beginPath();ctx.ellipse(x+1,y+2,7,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6a6660';ctx.beginPath();ctx.moveTo(x-6,y+3);ctx.lineTo(x-4,y-4);ctx.lineTo(x+2,y-5);ctx.lineTo(x+7,y-1);ctx.lineTo(x+5,y+3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8a8880';ctx.beginPath();ctx.moveTo(x-3,y-2);ctx.lineTo(x+1,y-4);ctx.lineTo(x+5,y);ctx.lineTo(x,y);ctx.closePath();ctx.fill();
}
</script>
<script>
// === DRAW BUILDING ===
function drawBuilding(bld,rx,ry){
  ctx.save();ctx.translate(rx,ry);
  const pct=bld.complete?1:bld.progress/bld.constructionTime;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(16,32,20,6,0,0,Math.PI*2);ctx.fill();
  if(!bld.complete){
    ctx.globalAlpha=.4+pct*.6;
    ctx.fillStyle='#5a4a30';ctx.fillRect(0,24,32,4);// foundation
    if(pct>.25){ctx.fillStyle='#8a7a50';ctx.fillRect(0,12,28,16)}
    if(pct>.5){ctx.fillStyle='#2c1a00';ctx.fillRect(10,16,6,12);ctx.strokeStyle='#6a5a30';ctx.lineWidth=1;ctx.strokeRect(-2,8,34,22)}
    if(pct>.75){ctx.fillStyle='#654321';ctx.beginPath();ctx.moveTo(-2,10);ctx.lineTo(16,-2);ctx.lineTo(34,10);ctx.fill()}
    ctx.globalAlpha=1;ctx.restore();return;
  }
  const t=bld.type;
  if(t==='Campfire'){
    ctx.fillStyle='#4a3520';for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;ctx.fillRect(12+Math.cos(a)*6,12+Math.sin(a)*6,3,3)}
    const f=Math.sin(performance.now()*.008)*.3+.7;
    ctx.fillStyle='rgba(255,100,0,'+f+')';ctx.beginPath();ctx.moveTo(14,4);ctx.lineTo(10,14);ctx.lineTo(18,14);ctx.fill();
    ctx.fillStyle='rgba(255,180,0,'+(f*.7)+')';ctx.beginPath();ctx.moveTo(14,7);ctx.lineTo(11,13);ctx.lineTo(17,13);ctx.fill();
    ctx.fillStyle='rgba(255,140,40,0.06)';ctx.beginPath();ctx.arc(14,10,22,0,Math.PI*2);ctx.fill();
  }else if(t==='Wood Hut'||t==='Log Cabin'){
    const w=t==='Log Cabin'?36:30,h=t==='Log Cabin'?28:24;
    ctx.fillStyle='#3d2b1f';ctx.fillRect(-1,h,w+4,3);
    ctx.fillStyle='#9a7830';ctx.fillRect(0,6,w,h-4);
    ctx.fillStyle='#7a5a20';ctx.fillRect(w,6,6,h-4);
    ctx.fillStyle='#7a2a10';ctx.beginPath();ctx.moveTo(-2,6);ctx.lineTo(w/2,-6);ctx.lineTo(w+4,6);ctx.fill();
    ctx.fillStyle='#601a08';ctx.beginPath();ctx.moveTo(w/2,-6);ctx.lineTo(w+4,6);ctx.lineTo(w+8,8);ctx.lineTo(w/2+4,-4);ctx.fill();
    ctx.fillStyle='#1a0a00';ctx.fillRect(w/2-3,14,7,h-12);
    ctx.fillStyle='#88bbdd';ctx.fillRect(3,10,4,4);ctx.fillRect(w-8,10,4,4);
  }else if(t==='Farm'){
    ctx.fillStyle='#3d2b1f';ctx.fillRect(-1,24,38,3);
    ctx.fillStyle='#8a7030';ctx.fillRect(0,8,32,18);
    ctx.fillStyle='#9a8840';ctx.beginPath();ctx.moveTo(-2,8);ctx.lineTo(18,-2);ctx.lineTo(38,8);ctx.fill();
    ctx.fillStyle='#1a0a00';ctx.fillRect(12,14,6,12);
    for(let i=0;i<3;i++){ctx.fillStyle='#5a3a1a';ctx.fillRect(-4,28+i*5,40,2);ctx.fillStyle='#4a8a2a';for(let j=0;j<5;j++)ctx.fillRect(-2+j*8,27+i*5,3,3)}
  }else if(t==='Stone House'){
    ctx.fillStyle='#3d2b1f';ctx.fillRect(-1,28,38,3);
    ctx.fillStyle='#808080';ctx.fillRect(0,4,32,26);
    for(let r=0;r<4;r++){ctx.fillStyle='#666';ctx.fillRect(0,4+r*6+5,32,1)}
    ctx.fillStyle='#606060';ctx.fillRect(32,4,6,26);
    ctx.fillStyle='#4a4a5a';ctx.beginPath();ctx.moveTo(-2,4);ctx.lineTo(18,-8);ctx.lineTo(40,4);ctx.fill();
    ctx.fillStyle='#3a3a4a';ctx.beginPath();ctx.moveTo(18,-8);ctx.lineTo(40,4);ctx.lineTo(44,6);ctx.lineTo(22,-6);ctx.fill();
    ctx.fillStyle='#1a0a00';ctx.fillRect(12,16,7,14);
    ctx.fillStyle='#88bbdd';ctx.fillRect(3,10,4,4);ctx.fillRect(24,10,4,4);
  }else if(t==='Blacksmith'){
    ctx.fillStyle='#3d2b1f';ctx.fillRect(-1,28,38,3);
    ctx.fillStyle='#5a5a5a';ctx.fillRect(0,4,32,26);ctx.fillStyle='#444';ctx.fillRect(32,4,6,26);

<script>
// === DRAW AGENT ===
function drawAgent(agent,rx,ry){
  const ko=agent.knockedOut;
  ctx.save();ctx.translate(rx,ry);
  if(ko){ctx.rotate(Math.PI/2);ctx.globalAlpha=.5}
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(1,12,8,3,0,0,Math.PI*2);ctx.fill();
  const body={human:'#3355aa',dwarf:'#aa6633',elf:'#33aa55',orc:'#993333'}[agent.race]||'#3355aa';
  const skin={human:'#f0c8a0',dwarf:'#d4a870',elf:'#f0c8a0',orc:'#7ab648'}[agent.race]||'#f0c8a0';
  // Body
  ctx.fillStyle=body;ctx.fillRect(-6,-8,12,16);
  ctx.fillStyle='#2a1a0a';ctx.fillRect(-6,2,12,2);//belt
  // Head
  ctx.fillStyle=skin;ctx.fillRect(-5,-18,10,10);
  // Eyes
  ctx.fillStyle='#111';
  if(agent.facing==='right'){ctx.fillRect(-1,-15,2,2);ctx.fillRect(3,-15,2,2)}
  else{ctx.fillRect(-5,-15,2,2);ctx.fillRect(-1,-15,2,2)}
  // Hat
  const hatC={analyst:'#4488cc',optimist:'#ffcc33',dreamer:'#cc88ff',overachiever:'#ff4444',aggressive:'#cc2222',chaotic:'#ff66ff',grinder:'#888',lazy:'#66aaaa'}[agent.personality]||'#666';
  ctx.fillStyle=hatC;ctx.fillRect(-6,-22,12,4);ctx.fillRect(-4,-24,8,3);
  // Legs
  const w=(['idle','rest'].includes(agent.currentTask))?0:Math.sin(agent.animFrame*.2)*3;
  ctx.fillStyle='#2a1a0a';ctx.fillRect(-4,8,3,5+w);ctx.fillRect(1,8,3,5-w);
  // Arms
  ctx.fillStyle=body;ctx.fillRect(-8,-6,3,10);ctx.fillRect(5,-6,3,10);
  // Tool
  if(agent.currentTask==='chop'){ctx.fillStyle='#6a5030';ctx.fillRect(7,-10,2,12);ctx.fillStyle='#aaa';ctx.fillRect(6,-12,4,3)}
  else if(agent.currentTask==='mine'){ctx.fillStyle='#6a5030';ctx.fillRect(7,-8,2,10);ctx.fillStyle='#aaa';ctx.fillRect(5,-10,6,2)}
  else if(agent.currentTask==='build'){ctx.fillStyle='#6a5030';ctx.fillRect(7,-6,2,10);ctx.fillStyle='#888';ctx.fillRect(5,-8,4,3)}
  // HP bar
  if(agent.health<100&&!ko){
    ctx.fillStyle='#111';ctx.fillRect(-9,-28,18,3);
    ctx.fillStyle=agent.health>50?'#3c3':agent.health>25?'#ca3':'#c33';
    ctx.fillRect(-9,-28,18*(agent.health/100),3);
  }
  ctx.restore();
  if(!ko){
    ctx.font='bold 9px monospace';const tw=ctx.measureText(agent.name).width;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(rx-tw/2-3,ry-35,tw+6,12);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(agent.name,rx,ry-25);ctx.textAlign='left';
  }
}
// === DRAW ANIMAL ===
function drawAnimal(a,rx,ry){
  ctx.save();ctx.translate(rx,ry);
  if(a.type==='deer'){
    ctx.fillStyle='rgba(0,0,0,0.12)';ctx.beginPath();ctx.ellipse(0,5,7,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#a07040';ctx.fillRect(-6,-3,12,7);
    ctx.fillStyle='#c09060';ctx.fillRect(-4,0,8,3);
    ctx.fillStyle='#8a6030';ctx.fillRect(-8,-7,4,5);
    ctx.fillStyle='#6a4a1a';ctx.fillRect(-4,4,2,4);ctx.fillRect(2,4,2,4);
    ctx.fillStyle='#6a5020';ctx.fillRect(-9,-11,1,5);ctx.fillRect(-6,-10,1,4);
  }else if(a.type==='rabbit'){
    ctx.fillStyle='rgba(0,0,0,0.08)';ctx.beginPath();ctx.ellipse(0,2,3,2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#b8a080';ctx.beginPath();ctx.ellipse(0,0,4,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c8b090';ctx.fillRect(-3,-7,2,4);ctx.fillRect(0,-7,2,4);
  }else if(a.type==='chicken'){
    ctx.fillStyle='rgba(0,0,0,0.08)';ctx.beginPath();ctx.ellipse(0,2,3,2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f0e0c0';ctx.beginPath();ctx.ellipse(0,0,4,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#cc3300';ctx.fillRect(-3,-4,2,2);ctx.fillStyle='#ff8800';ctx.fillRect(-5,-2,2,1);
  }else if(a.type==='wolf'){
    ctx.fillStyle='rgba(0,0,0,0.12)';ctx.beginPath();ctx.ellipse(0,5,8,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#505050';ctx.fillRect(-7,-3,14,7);ctx.fillStyle='#444';ctx.fillRect(-9,-7,5,5);
    ctx.fillRect(-5,4,2,4);ctx.fillRect(3,4,2,4);
  }else if(a.type==='fish'){
    const j=a.jumpTimer<20,jy=j?-Math.sin((20-a.jumpTimer)/20*Math.PI)*10:0;
    ctx.translate(0,jy);ctx.globalAlpha=j?1:.4;
    ctx.fillStyle='#5588bb';ctx.beginPath();ctx.ellipse(0,0,4,2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4477aa';ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(7,-2);ctx.lineTo(7,2);ctx.fill();
    if(j){ctx.fillStyle='rgba(150,200,255,0.4)';ctx.beginPath();ctx.arc(0,4,2,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
</script>
<script>
// === WEBSOCKET, INPUT, UI ===
let ws=null,connected=false,spectatorPoints=0;
function connect(){
  const p=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(p+'//'+location.host);
  ws.onopen=()=>{connected=true;document.getElementById('loading').style.display='none';document.getElementById('reconnect').style.display='none';document.getElementById('game-container').style.display='block';resize()};
  ws.onclose=()=>{connected=false;document.getElementById('reconnect').style.display='flex';setTimeout(connect,3000)};
  ws.onerror=()=>{ws.close()};
  ws.onmessage=(e)=>{try{const m=JSON.parse(e.data);
    if(m.type==='state'){serverState=m;
      if(m.terrainMods)for(const mod of m.terrainMods){if(terrainData[mod.y]&&terrainData[mod.y][mod.x]){const c=terrainData[mod.y][mod.x];if(mod.hasTree!==undefined&&c.hasTree!==mod.hasTree){c.hasTree=mod.hasTree;c.drawTree=mod.hasTree;terrainDirty=true}if(mod.hasRock!==undefined)c.hasRock=mod.hasRock;if(mod.stump!==undefined)c.stump=mod.stump}}
      updateUI(m);
      if(m.activeEvent&&m.activeEvent!==lastBannerText){lastBannerText=m.activeEvent;const b=document.getElementById('event-banner');b.textContent=m.activeEvent;b.classList.add('visible');bannerTimer=180}
    }else if(m.type==='points_update'){spectatorPoints=m.points;document.getElementById('points-display').textContent=m.points}
  }catch(err){}}
}
canvas.addEventListener('mousedown',(e)=>{if(e.button===0){dragging=true;dragSX=e.clientX;dragSY=e.clientY;dragCX=camX;dragCY=camY;canvas.style.cursor='grabbing';followAgent=null}});
window.addEventListener('mousemove',(e)=>{if(dragging){camX=dragCX-(e.clientX-dragSX)/zoom;camY=dragCY-(e.clientY-dragSY)/zoom}});
window.addEventListener('mouseup',()=>{dragging=false;canvas.style.cursor='grab'});
canvas.addEventListener('wheel',(e)=>{e.preventDefault();const o=zoom;zoom=Math.max(.3,Math.min(3,zoom*(e.deltaY<0?1.1:.9)));camX+=e.clientX/o-e.clientX/zoom;camY+=(e.clientY-36)/o-(e.clientY-36)/zoom},{passive:false});
canvas.addEventListener('dblclick',(e)=>{if(!serverState)return;const wx=camX+e.clientX/zoom,wy=camY+(e.clientY-36)/zoom;let cl=null,md=60;for(const a of serverState.agents){const d=Math.abs(a.x-wx)+Math.abs(a.y-wy);if(d<md){md=d;cl=a}}if(cl){followAgent=cl.name;selectedAgent=cl.name;showAgentDetail()}});

  const bar=(l,v,m,c)=>'<div style="margin:1px 0"><span style="display:inline-block;width:50px;color:#777">'+l+'</span><span style="display:inline-block;width:100px;height:5px;background:#1a1a24;border-radius:2px;vertical-align:middle"><span style="display:inline-block;width:'+(v/m*100)+'%;height:100%;background:'+c+';border-radius:2px"></span></span> <span style="color:#666">'+Math.round(v)+'</span></div>';
  document.getElementById('detail-stats').innerHTML=bar('HP',a.health,100,a.health>50?'#3c3':'#c33')+bar('Energy',a.energy,100,'#38c')+bar('Hunger',a.hunger,100,'#c83')+bar('Morale',a.morale,100,'#cc3');
  document.getElementById('detail-inventory').innerHTML='<span style="color:#8B6914">W:'+a.inventory.wood+'</span> <span style="color:#888">S:'+a.inventory.stone+'</span> <span style="color:#ffd700">G:'+(a.inventory.gold||0)+'</span> <span style="color:#6a4">F:'+a.inventory.food+'</span>';

document.getElementById('btn-food').addEventListener('click',()=>{if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'drop_food',x:camX+W/(2*zoom),y:camY+H/(2*zoom)}))});

function updateUI(s){

  document.getElementById('pop-display').textContent=s.agents.length;
  document.getElementById('bld-display').textContent=s.buildings.filter(b=>b.complete).length;

  document.getElementById('spec-display').textContent=s.spectatorCount;
  document.getElementById('event-display').textContent=s.activeEvent||'';
  document.getElementById('time-icon-display').innerHTML=(s.timeOfDay>.25&&s.timeOfDay<.75)?'<span style="color:#ffd700">&#9788;</span>':'<span style="color:#aaccff">&#9789;</span>';
  const T={idle:'Idle',chop:'Chopping',mine:'Mining',forage:'Foraging',build:'Building',rest:'Resting',explore:'Exploring',socialize:'Chatting',fight:'Fighting!',flee:'Fleeing!'};
  let ah='';for(const a of s.agents){const c=a.clan?(s.clans.find(x=>x.id===a.clan)||{}).color||'#888':RACE_COLORS[a.race]||'#888';ah+='<div class="agent-item" data-agent="'+a.name+'"><span class="agent-dot" style="background:'+c+'"></span><span><span class="agent-name">'+a.name+'</span><br><span class="agent-task">'+(T[a.currentTask]||a.currentTask)+'</span></span><span class="agent-health-bar"><span class="agent-health-fill" style="width:'+a.health+'%;background:'+(a.health>50?'#3c3':'#c33')+'"></span></span></div>'}
  const al=document.getElementById('agent-list');al.innerHTML=ah;al.querySelectorAll('.agent-item').forEach(el=>{el.addEventListener('click',()=>{followAgent=el.dataset.agent;selectedAgent=el.dataset.agent;showAgentDetail()})});
  document.getElementById('settlement-list').innerHTML=s.settlements.map(x=>'<div class="settlement-item">'+x.name+' <span style="color:#666">('+x.phase+', '+(x.buildingCount||0)+')</span></div>').join('');
  document.getElementById('clan-list').innerHTML=s.clans.map(c=>'<div style="color:'+c.color+';padding:2px 0;font-size:12px">'+c.name+' ('+c.members.length+')</div>').join('');
  document.getElementById('event-feed').innerHTML=s.recentEvents.slice(0,15).map(e=>'<div class="event-item">'+e.text+'</div>').join('');
  // Minimap
  minimapCtx.drawImage(mmCache,0,0);
  const mx=254/(WORLD_WIDTH*TILE_SIZE),my=200/(WORLD_HEIGHT*TILE_SIZE);
  for(const b of s.buildings){minimapCtx.fillStyle=b.complete?'#ffd700':'#886600';minimapCtx.fillRect(b.x*TILE_SIZE*mx-1,b.y*TILE_SIZE*my-1,3,3)}
  for(const a of s.agents){minimapCtx.fillStyle=RACE_COLORS[a.race]||'#f44';minimapCtx.fillRect(a.x*mx-1,a.y*my-1,3,3)}
  minimapCtx.strokeStyle='rgba(255,255,255,.7)';minimapCtx.lineWidth=1;minimapCtx.strokeRect(camX*mx,camY*my,W/zoom*mx,H/zoom*my);
  updateAgentDetail();

<script>
// === MAIN RENDER LOOP ===
let lastFrame=performance.now();
function render(now){
  requestAnimationFrame(render);
  const dt=Math.min(now-lastFrame,100);lastFrame=now;
  fpsC++;if(now-fpsT>=1000){fpsD=fpsC;fpsC=0;fpsT=now;document.getElementById('fps-display').textContent=fpsD+' FPS'}
  if(!serverState)return;
  if(followAgent){const a=serverState.agents.find(x=>x.name===followAgent);if(a){camX+=(a.x-W/(2*zoom)-camX)*.05;camY+=(a.y-H/(2*zoom)-camY)*.05}}
  camX=Math.max(0,Math.min(WORLD_WIDTH*TILE_SIZE-W/zoom,camX));
  camY=Math.max(0,Math.min(WORLD_HEIGHT*TILE_SIZE-H/zoom,camY));

  ctx.clearRect(0,0,W,H);ctx.save();ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);
  const vx1=Math.max(0,Math.floor(camX/TILE_SIZE)-2),vy1=Math.max(0,Math.floor(camY/TILE_SIZE)-2);
  const vx2=Math.min(WORLD_WIDTH,Math.ceil((camX+W/zoom)/TILE_SIZE)+2),vy2=Math.min(WORLD_HEIGHT,Math.ceil((camY+H/zoom)/TILE_SIZE)+2);

  if(terrainDirty)renderTerrainCache();
  ctx.drawImage(terrainCache,0,0);

  // Water shimmer
  const st=now*.001;
  for(let y=vy1;y<vy2;y++)for(let x=vx1;x<vx2;x++){
    const c=terrainData[y][x];
    if(c.type==='shallow_water'||c.type==='deep_water'){
      const sh=Math.sin(st*1.5+x*.7+y*.5)*.08;
      if(sh>0){ctx.fillStyle='rgba(100,170,240,'+sh.toFixed(2)+')';ctx.fillRect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE)}
    }
  }

  // Collect Y-sorted entities
  const dl=[];
  for(let y=vy1;y<vy2;y++)for(let x=vx1;x<vx2;x++){
    const c=terrainData[y][x];
    if(c.stump)dl.push({t:'stump',y:y*TILE_SIZE+TILE_SIZE,x:x*TILE_SIZE+TILE_SIZE/2});
    if(c.drawTree&&c.hasTree){
      let w=0;for(const a of serverState.agents)if(a.currentTask==='chop'&&a.taskTimer>0){const tx=Math.floor((a.targetX||0)/TILE_SIZE),ty=Math.floor((a.targetY||0)/TILE_SIZE);if(tx===x&&ty===y){w=Math.sin(now*.008)*.06;break}}
      dl.push({t:'tree',y:y*TILE_SIZE+TILE_SIZE,x:x*TILE_SIZE+TILE_SIZE/2,tt:c.treeType,w});
    }
    if(c.hasRock)dl.push({t:'rock',y:y*TILE_SIZE+TILE_SIZE,x:x*TILE_SIZE+TILE_SIZE/2});
  }
  for(const b of serverState.buildings)if(b.x>=vx1-1&&b.x<=vx2+1&&b.y>=vy1-1&&b.y<=vy2+1)dl.push({t:'bld',y:b.y*TILE_SIZE+TILE_SIZE+12,x:b.x*TILE_SIZE,d:b});
  for(const a of serverState.animals){const gx=a.x/TILE_SIZE,gy=a.y/TILE_SIZE;if(gx>=vx1-1&&gx<=vx2+1&&gy>=vy1-1&&gy<=vy2+1){const k=a.type+'_'+Math.round(a.x/40)+'_'+Math.round(a.y/40);if(!interpPos[k])interpPos[k]={x:a.x,y:a.y};interpPos[k].x+=(a.x-interpPos[k].x)*.12;interpPos[k].y+=(a.y-interpPos[k].y)*.12;dl.push({t:'ani',y:interpPos[k].y,x:interpPos[k].x,d:a,rx:interpPos[k].x,ry:interpPos[k].y})}}
  for(const a of serverState.agents){const gx=a.x/TILE_SIZE,gy=a.y/TILE_SIZE;if(gx>=vx1-3&&gx<=vx2+3&&gy>=vy1-3&&gy<=vy2+3){if(!interpPos[a.name])interpPos[a.name]={x:a.x,y:a.y};interpPos[a.name].x+=(a.x-interpPos[a.name].x)*.12;interpPos[a.name].y+=(a.y-interpPos[a.name].y)*.12;dl.push({t:'agt',y:interpPos[a.name].y+8,x:interpPos[a.name].x,d:a,rx:interpPos[a.name].x,ry:interpPos[a.name].y})}}

  dl.sort((a,b)=>a.y-b.y);
  for(const i of dl){
    if(i.t==='stump')drawStump(i.x,i.y-2);
    else if(i.t==='tree')drawTree(i.x,i.y,i.tt,i.w);
    else if(i.t==='rock')drawRock(i.x,i.y-2);
    else if(i.t==='bld')drawBuilding(i.d,i.x,i.y-TILE_SIZE-12);
    else if(i.t==='ani')drawAnimal(i.d,i.rx,i.ry);
    else if(i.t==='agt')drawAgent(i.d,i.rx,i.ry);
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.life--;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.c;ctx.fillRect(p.x-1,p.y-1,p.s,p.s);ctx.globalAlpha=1}
  for(const a of serverState.agents){const ip=interpPos[a.name];if(!ip)continue;
    if(a.currentTask==='chop'&&a.taskTimer>0&&Math.random()<.1)particles.push({x:ip.x,y:ip.y-10,vx:(Math.random()-.5)*1.5,vy:-Math.random()*1.5,life:16,ml:16,c:'#8B6914',s:2});
    if(a.currentTask==='mine'&&a.taskTimer>0&&Math.random()<.08)particles.push({x:ip.x,y:ip.y-10,vx:(Math.random()-.5)*1.5,vy:-Math.random()*1.5,life:12,ml:12,c:Math.random()<.3?'#fc0':'#888',s:2});
    if(a.currentTask==='fight'&&Math.random()<.12){particles.push({x:ip.x+(Math.random()-.5)*6,y:ip.y-4,vx:(Math.random()-.5)*2,vy:-Math.random()*1.5,life:10,ml:10,c:'#f33',s:3});ctx.fillStyle='rgba(255,50,50,'+(0.1+Math.sin(now*.01)*.08).toFixed(2)+')';ctx.beginPath();ctx.arc(ip.x,ip.y,16,0,Math.PI*2);ctx.fill()}
    if(!a._pH)a._pH=a.health;if(a.health<a._pH)floatingTexts.push({x:ip.x,y:ip.y-26,text:'-'+Math.round(a._pH-a.health),life:40,ml:40});a._pH=a.health;
  }
  for(let i=floatingTexts.length-1;i>=0;i--){const f=floatingTexts[i];f.y-=.5;f.life--;if(f.life<=0){floatingTexts.splice(i,1);continue}ctx.globalAlpha=f.life/f.ml;ctx.fillStyle='#f44';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.textAlign='left';ctx.globalAlpha=1}

  // Day/night
  const tod=serverState.timeOfDay;let oa=0;
  if(tod<.2||tod>.8)oa=.4;
  else if(tod<.3)oa=.4*(1-(1-Math.cos((tod-.2)/.1*Math.PI))*.5);
  else if(tod>.7)oa=.4*(1-Math.cos((tod-.7)/.1*Math.PI))*.5;
  if(oa>.005){ctx.fillStyle='rgba(10,10,40,'+oa.toFixed(3)+')';ctx.fillRect(camX,camY,W/zoom,H/zoom)}
  // Night glow
  if(tod>.75||tod<.25){for(const b of serverState.buildings){if(!b.complete||b.x<vx1||b.x>vx2||b.y<vy1||b.y>vy2)continue;const bx=b.x*TILE_SIZE,by=b.y*TILE_SIZE;
    if(['Wood Hut','Log Cabin','Stone House','Town Hall','Blacksmith','Church','Barracks','Library'].includes(b.type)){ctx.fillStyle='rgba(255,215,0,0.5)';ctx.fillRect(bx+3,by+10,3,3);ctx.fillRect(bx+24,by+10,3,3);ctx.fillStyle='rgba(255,200,80,0.05)';ctx.beginPath();ctx.arc(bx+16,by+16,28,0,Math.PI*2);ctx.fill()}
    if(b.type==='Campfire'){ctx.fillStyle='rgba(255,140,40,0.1)';ctx.beginPath();ctx.arc(bx+14,by+10,30,0,Math.PI*2);ctx.fill()}
  }}

  ctx.restore();
  if(bannerTimer>0){bannerTimer--;if(bannerTimer<=0){document.getElementById('event-banner').classList.remove('visible');lastBannerText=''}}
}
connect();requestAnimationFrame(render);
</script>
</body></html>
