<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentCraft</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a14; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
#loading { position: fixed; inset: 0; background: #0a0a14; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
#loading h1 { color: #f0c040; font-size: 32px; margin-bottom: 16px; letter-spacing: 4px; }
#loading p { color: #888; font-size: 14px; }
#loading .spinner { width: 40px; height: 40px; border: 3px solid #222; border-top-color: #f0c040; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
#reconnect { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 999; flex-direction: column; }
#reconnect h2 { color: #ff6b6b; margin-bottom: 10px; }
#reconnect p { color: #888; }
#game-container { display: none; width: 100vw; height: 100vh; position: relative; }
#gameCanvas { position: absolute; top: 0; left: 0; cursor: grab; image-rendering: pixelated; }
#sidebar { position: absolute; top: 0; right: 0; width: 280px; height: 100vh; background: #111118; border-left: 2px solid #252530; overflow-y: auto; z-index: 10; padding: 12px; font-size: 12px; }
#sidebar::-webkit-scrollbar { width: 6px; }
#sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
#topbar { position: absolute; top: 0; left: 0; right: 280px; height: 40px; background: #0a0a14; border-bottom: 2px solid #252530; z-index: 10; display: flex; align-items: center; padding: 0 16px; gap: 16px; font-size: 13px; }
#topbar .title { color: #f0c040; font-weight: bold; font-size: 16px; letter-spacing: 2px; }
#topbar .stat { color: #777; }
#topbar .stat span { color: #ddd; font-weight: bold; }
#topbar .live-dot { display: inline-block; width: 8px; height: 8px; background: #ff3333; border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; margin-right: 4px; vertical-align: middle; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
#minimap { width: 254px; height: 200px; border: 1px solid #333; margin-bottom: 10px; image-rendering: pixelated; background: #0a0a14; }
.section-title { color: #f0c040; font-size: 12px; font-weight: bold; margin: 12px 0 6px; border-bottom: 1px solid #252530; padding-bottom: 3px; text-transform: uppercase; letter-spacing: 1px; }
.agent-item { padding: 5px 6px; margin: 2px 0; border-radius: 3px; background: rgba(255,255,255,0.03); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s; }
.agent-item:hover { background: rgba(255,255,255,0.08); }
.agent-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
.agent-name { font-weight: bold; color: #ddd; font-size: 12px; }
.agent-task { color: #777; font-size: 10px; }
.agent-health-bar { width: 40px; height: 4px; background: #1a1a24; border-radius: 2px; margin-left: auto; }
.agent-health-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.settlement-item { padding: 4px 6px; margin: 2px 0; color: #b0c8a0; cursor: pointer; }
.settlement-item:hover { color: #d0e8c0; }
.event-item { padding: 3px 0; color: #666; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.event-item:first-child { color: #bbb; }
#deploy-panel { margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 4px; border: 1px solid #252530; }
#deploy-panel input, #deploy-panel select { width: 100%; padding: 5px 6px; margin: 3px 0; background: #0a0a14; color: #e0e0e0; border: 1px solid #333; border-radius: 3px; font-family: inherit; font-size: 12px; }
#deploy-panel button, .influence-btn { width: 100%; padding: 7px; margin: 3px 0; background: #1a3a2a; color: #7fdbca; border: 1px solid #2a5a4a; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 12px; transition: background 0.15s; }
#deploy-panel button:hover, .influence-btn:hover { background: #2a5a4a; }
.influence-btn { background: #1a1a2e; color: #99a; border-color: #333; }
.points-display { color: #ffd700; font-weight: bold; text-align: center; margin: 6px 0; font-size: 13px; }
.event-banner { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); background: rgba(10,10,20,0.95); border: 2px solid #f0c040; border-radius: 6px; padding: 10px 24px; color: #f0c040; font-size: 14px; font-weight: bold; z-index: 20; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
.event-banner.visible { opacity: 1; }
</style>
</head>
<body>
<div id="loading"><h1>AGENTCRAFT</h1><p>Connecting to the living world...</p><div class="spinner"></div></div>
<div id="reconnect"><h2>Disconnected</h2><p>Reconnecting...</p></div>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="topbar">
    <span class="title">AGENTCRAFT</span>
    <span class="stat"><span class="live-dot"></span>LIVE</span>
    <span class="stat">Era: <span id="era-display">Wood</span></span>
    <span class="stat">Pop: <span id="pop-display">0</span></span>
    <span class="stat">Buildings: <span id="bld-display">0</span></span>
    <span class="stat" id="time-icon-display"></span>
    <span class="stat">Day <span id="day-display">1</span></span>
    <span class="stat">Spectators: <span id="spec-display">0</span></span>
    <span class="stat" id="fps-display" style="margin-left:auto;color:#555"></span>
    <span class="stat" id="event-display" style="color:#f0c040"></span>
  </div>
  <div id="sidebar">
    <canvas id="minimap" width="254" height="200"></canvas>
    <div id="agent-detail" style="display:none;padding:8px;background:rgba(255,255,255,0.04);border-radius:4px;margin-bottom:8px;border:1px solid #252530">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span id="detail-name" style="font-weight:bold;color:#f0c040;font-size:13px"></span>
        <span id="detail-close" style="cursor:pointer;color:#555;font-size:16px">&times;</span>
      </div>
      <div id="detail-info" style="font-size:11px;color:#999;margin-top:4px"></div>
      <div id="detail-stats" style="font-size:11px;margin-top:4px"></div>
      <div id="detail-inventory" style="font-size:11px;margin-top:4px"></div>
      <div id="detail-relations" style="font-size:11px;margin-top:4px;color:#666"></div>
    </div>
    <div class="section-title">Active Agents</div>
    <div id="agent-list"></div>
    <div class="section-title">Settlements</div>
    <div id="settlement-list"></div>
    <div class="section-title">Clans</div>
    <div id="clan-list"></div>
    <div class="section-title">Event Feed</div>
    <div id="event-feed"></div>
    <div class="section-title">Spectator</div>
    <div class="points-display">Points: <span id="points-display">0</span></div>
    <div id="deploy-panel">
      <input id="deploy-name" placeholder="Agent name" maxlength="16">
      <select id="deploy-race"><option value="human">Human</option><option value="dwarf">Dwarf</option><option value="elf">Elf</option><option value="orc">Orc</option></select>
      <select id="deploy-personality"><option value="analyst">Analyst</option><option value="optimist">Optimist</option><option value="dreamer">Dreamer</option><option value="overachiever">Overachiever</option><option value="aggressive">Aggressive</option><option value="chaotic">Chaotic</option><option value="grinder">Grinder</option><option value="lazy">Lazy</option></select>
      <button id="deploy-btn">Deploy Agent</button>
    </div>
    <div style="margin-top:6px">
      <button class="influence-btn" id="btn-food">Drop Food (10 pts)</button>
      <button class="influence-btn" id="btn-rain">Trigger Rain (15 pts)</button>
      <button class="influence-btn" id="btn-speed">Speed Boost (20 pts)</button>
      <button class="influence-btn" id="btn-gift">Mystery Gift (25 pts)</button>
    </div>
  </div>
  <div class="event-banner" id="event-banner"></div>
</div>

<script>
// ============================================================================
// CLIENT — Noise & Terrain (identical to server, seed 42)
// ============================================================================
const WORLD_WIDTH = 200, WORLD_HEIGHT = 200, TILE_SIZE = 16;

function seededRandom(seed) {
  let s = seed;
  return function() { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}
function hashCell(x, y, seed) {
  let h = seed;
  h = ((h << 5) - h + x) | 0; h = ((h << 5) - h + y) | 0;
  h = ((h << 5) - h + x * 31) | 0; h = ((h << 5) - h + y * 17) | 0;
  return ((h & 0x7fffffff) % 10000) / 10000;
}
const PERM = new Uint8Array(512);
(function() {
  const rng = seededRandom(42);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function grad2d(hash, x, y) { const h = hash & 3; return (h & 1 ? x : -x) + (h & 2 ? y : -y); }
function noise2d(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = PERM[X] + Y, b = PERM[X + 1] + Y;
  return 0.5 + 0.5 * (grad2d(PERM[a], xf, yf) * (1-u) * (1-v) + grad2d(PERM[b], xf-1, yf) * u * (1-v) + grad2d(PERM[a+1], xf, yf-1) * (1-u) * v + grad2d(PERM[b+1], xf-1, yf-1) * u * v);
}
function fbm(x, y, oct, lac, gain) {
  let sum = 0, amp = 1, freq = 1, max = 0;
  for (let i = 0; i < oct; i++) { sum += noise2d(x*freq, y*freq)*amp; max += amp; amp *= gain; freq *= lac; }
  return sum / max;
}
function getBiome(e, m) {
  if (e < 0.22) return 'deep_water'; if (e < 0.30) return 'shallow_water'; if (e < 0.33) return 'beach';
  if (e > 0.85) return 'snow'; if (e > 0.75) return 'mountain'; if (e > 0.65) return 'mountain_base';
  if (m < 0.25 && e < 0.55) return 'desert'; if (m > 0.7 && e < 0.4) return 'swamp';
  if (m > 0.6) return 'dense_forest'; if (m > 0.4) return 'forest'; return 'grass';
}

// Lush biome colors — subtle checkerboard (close shades)
const BIOME_COLORS = {
  deep_water:    ['#2858a8', '#2550a0'],
  shallow_water: ['#3872be', '#346ab6'],
  beach:         ['#d4b896', '#ccb088'],
  grass:         ['#4a9040', '#439038'],
  forest:        ['#3a7a34', '#35752e'],
  dense_forest:  ['#2e6a28', '#2a6424'],
  desert:        ['#d4b896', '#ccb088'],
  mountain_base: ['#8a8078', '#847a72'],
  mountain:      ['#807470', '#7a6e6a'],
  snow:          ['#e4eef4', '#e0eaf0'],
  swamp:         ['#3a5e30', '#34582a']
};
const MINIMAP_COLORS = {
  deep_water: '#1a3a88', shallow_water: '#2a5aaa', beach: '#c4a878', grass: '#4a8f3f',
  forest: '#2d6b28', dense_forest: '#245a20', desert: '#c4a878', mountain_base: '#7a7068',
  mountain: '#6a6058', snow: '#dde8ee', swamp: '#2e4e22'
};

// Generate terrain data locally (matches server exactly)
const terrainData = [];
for (let y = 0; y < WORLD_HEIGHT; y++) {
  terrainData[y] = [];
  for (let x = 0; x < WORLD_WIDTH; x++) {
    const nx = x / WORLD_WIDTH, ny = y / WORLD_HEIGHT;
    const elevation = fbm(nx*4+0.5, ny*4+0.5, 6, 2.0, 0.5);
    const moisture = fbm(nx*3+10.7, ny*3+10.7, 5, 2.0, 0.5);
    const biome = getBiome(elevation, moisture);
    const h = hashCell(x, y, 42);
    let hasTree = false, treeType = 'oak';
    if (biome === 'dense_forest') hasTree = h < 0.8;
    else if (biome === 'forest') hasTree = h < 0.6;
    else if (biome === 'grass') hasTree = h < 0.1;
    else if (biome === 'mountain_base') hasTree = h < 0.2;
    else if (biome === 'swamp') hasTree = h < 0.3;
    if (hasTree) {
      const h2 = hashCell(x+1000, y+1000, 42);
      treeType = h2 < 0.5 ? 'oak' : h2 < 0.8 ? 'pine' : 'birch';
      if (biome === 'mountain_base') treeType = 'pine';
      if (biome === 'swamp') treeType = 'oak';
    }
    let hasRock = false;
    if (biome === 'mountain') hasRock = h < 0.5;
    else if (biome === 'mountain_base') hasRock = hashCell(x+500, y+500, 42) < 0.3;
    else if (biome === 'grass') hasRock = hashCell(x+500, y+500, 42) < 0.05;
    terrainData[y][x] = { type: biome, elevation, hasTree, treeType, hasRock, stump: false, renderTree: false };
  }
}
// Thin out tree rendering — skip trees whose neighbors already have trees to avoid stripe pattern
// Server still tracks all trees for gameplay, this is visual only
for (let y = 0; y < WORLD_HEIGHT; y++) {
  for (let x = 0; x < WORLD_WIDTH; x++) {
    const c = terrainData[y][x];
    if (!c.hasTree) continue;
    // In dense areas, only render ~40% of trees; in sparse areas render all
    const h = hashCell(x + 777, y + 777, 42);
    if (c.type === 'dense_forest') {
      // Only render if no rendered tree in immediate neighbors
      const hasRenderedNeighbor =
        (x > 0 && terrainData[y][x-1].renderTree) ||
        (y > 0 && terrainData[y-1][x].renderTree) ||
        (x > 0 && y > 0 && terrainData[y-1][x-1].renderTree);
      if (hasRenderedNeighbor && h < 0.55) continue;
      c.renderTree = true;
    } else if (c.type === 'forest') {
      const hasRenderedNeighbor =
        (x > 0 && terrainData[y][x-1].renderTree) ||
        (y > 0 && terrainData[y-1][x].renderTree);
      if (hasRenderedNeighbor && h < 0.4) continue;
      c.renderTree = true;
    } else {
      c.renderTree = true;
    }
  }
}
</script>
<script>
// ============================================================================
// Canvas, Camera, Terrain Cache
// ============================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');

let W = window.innerWidth, H = window.innerHeight;
canvas.width = W; canvas.height = H;

let camX = WORLD_WIDTH * TILE_SIZE / 2 - W / 2;
let camY = WORLD_HEIGHT * TILE_SIZE / 2 - H / 2;
let zoom = 1.0;
let dragging = false, dragStartX = 0, dragStartY = 0, dragCamX = 0, dragCamY = 0;
let followAgent = null;

// Terrain cache
const terrainCache = document.createElement('canvas');
terrainCache.width = WORLD_WIDTH * TILE_SIZE;
terrainCache.height = WORLD_HEIGHT * TILE_SIZE;
const tCtx = terrainCache.getContext('2d');
let terrainDirty = true;

function renderTerrainCache() {
  for (let y = 0; y < WORLD_HEIGHT; y++) {
    for (let x = 0; x < WORLD_WIDTH; x++) {
      const cell = terrainData[y][x];
      const colors = BIOME_COLORS[cell.type] || BIOME_COLORS.grass;
      tCtx.fillStyle = (x + y) % 2 === 0 ? colors[0] : colors[1];
      tCtx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

      // Darker patches on grass for variety
      if ((cell.type === 'grass' || cell.type === 'forest') && hashCell(x+300, y+300, 42) < 0.15) {
        tCtx.fillStyle = 'rgba(0,0,0,0.06)';
        tCtx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }
      // Swamp brown patches
      if (cell.type === 'swamp' && hashCell(x+400, y+400, 42) < 0.2) {
        tCtx.fillStyle = 'rgba(80,50,20,0.2)';
        tCtx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }
      // Ground details: flowers, mushrooms on grass
      if (cell.type === 'grass' && !cell.hasTree && !cell.hasRock) {
        const fh = hashCell(x+200, y+200, 42);
        if (fh < 0.04) {
          tCtx.fillStyle = '#ee6688';
          tCtx.fillRect(x*TILE_SIZE+5, y*TILE_SIZE+6, 2, 2);
          tCtx.fillRect(x*TILE_SIZE+9, y*TILE_SIZE+10, 2, 2);
        } else if (fh < 0.07) {
          tCtx.fillStyle = '#eedd44';
          tCtx.fillRect(x*TILE_SIZE+7, y*TILE_SIZE+8, 2, 2);
        }
      }
    }
  }
  terrainDirty = false;
}
renderTerrainCache();

// Minimap
const minimapCache = document.createElement('canvas');
minimapCache.width = 254; minimapCache.height = 200;
const mmCtx = minimapCache.getContext('2d');
function renderMinimapBase() {
  const mw = 254, mh = 200;
  const sx = mw / WORLD_WIDTH, sy = mh / WORLD_HEIGHT;
  for (let y = 0; y < WORLD_HEIGHT; y++) {
    for (let x = 0; x < WORLD_WIDTH; x++) {
      mmCtx.fillStyle = MINIMAP_COLORS[terrainData[y][x].type] || '#4a8f3f';
      mmCtx.fillRect(x * sx, y * sy, Math.ceil(sx), Math.ceil(sy));
    }
  }
}
renderMinimapBase();

// State
let serverState = null;
let particles = [];
let floatingTexts = [];
let selectedAgent = null;
let bannerTimer = 0;
let lastBannerText = '';
const interpPos = {};
let fpsCounter = 0, fpsTime = 0, fpsDisplay = 0;
</script>
<script>
// ============================================================================
// Drawing — Trees, Rocks, Stumps
// ============================================================================
function drawTree(x, y, type, wobble) {
  ctx.save();
  ctx.translate(x, y);
  if (wobble) ctx.rotate(wobble);

  if (type === 'pine') {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(3, 3, 7, 4, 0, 0, Math.PI*2); ctx.fill();
    // Trunk
    ctx.fillStyle = '#5C3A1E'; ctx.fillRect(-1, -3, 3, 9);
    // Lower tier
    ctx.fillStyle = '#1a5c1a';
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-7, -5); ctx.lineTo(7, -5); ctx.closePath(); ctx.fill();
    // Upper tier
    ctx.fillStyle = '#1f6e1f';
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(-5, -14); ctx.lineTo(5, -14); ctx.closePath(); ctx.fill();
    // Highlight
    ctx.fillStyle = '#2a882a';
    ctx.beginPath(); ctx.moveTo(-1, -24); ctx.lineTo(-4, -16); ctx.lineTo(1, -16); ctx.closePath(); ctx.fill();
  } else if (type === 'birch') {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(3, 3, 9, 4, 0, 0, Math.PI*2); ctx.fill();
    // Trunk (white birch)
    ctx.fillStyle = '#d4c4a8'; ctx.fillRect(-1, -4, 3, 10);
    ctx.fillStyle = '#6a5a40'; ctx.fillRect(0, -1, 1, 1); ctx.fillRect(0, 2, 1, 1);
    // Canopy
    ctx.fillStyle = '#3aaa3a';
    ctx.beginPath(); ctx.arc(0, -13, 10, 0, Math.PI*2); ctx.fill();
    // Highlight
    ctx.fillStyle = '#50cc50';
    ctx.beginPath(); ctx.arc(-2, -15, 6, 0, Math.PI*2); ctx.fill();
    // Light dot
    ctx.fillStyle = '#70e870';
    ctx.beginPath(); ctx.arc(-4, -17, 3, 0, Math.PI*2); ctx.fill();
  } else {
    // Oak (default) — round tree
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(3, 3, 10, 5, 0, 0, Math.PI*2); ctx.fill();
    // Trunk
    ctx.fillStyle = '#5C3A1E'; ctx.fillRect(-2, -4, 4, 10);
    // Main canopy
    ctx.fillStyle = '#2d8b2d';
    ctx.beginPath(); ctx.arc(0, -13, 11, 0, Math.PI*2); ctx.fill();
    // Highlight circle
    ctx.fillStyle = '#3caf3c';
    ctx.beginPath(); ctx.arc(-2, -15, 7, 0, Math.PI*2); ctx.fill();
    // Specular light dot
    ctx.fillStyle = '#5ccf5c';
    ctx.beginPath(); ctx.arc(-4, -18, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawStump(x, y) {
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(x+2, y+2, 6, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5C3A1E'; ctx.fillRect(x-4, y-4, 8, 6);
  ctx.fillStyle = '#7a5a2a'; ctx.fillRect(x-3, y-4, 6, 2);
  // Rings
  ctx.fillStyle = '#8a6a3a'; ctx.fillRect(x-2, y-3, 4, 1);
}

function drawRock(x, y) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x+2, y+3, 8, 4, 0, 0, Math.PI*2); ctx.fill();
  // Main rock body
  ctx.fillStyle = '#7a7068';
  ctx.beginPath(); ctx.moveTo(x-7,y+4); ctx.lineTo(x-6,y-5); ctx.lineTo(x+1,y-7); ctx.lineTo(x+8,y-2); ctx.lineTo(x+6,y+4); ctx.closePath(); ctx.fill();
  // Highlight face
  ctx.fillStyle = '#9a9088';
  ctx.beginPath(); ctx.moveTo(x-4,y-3); ctx.lineTo(x+1,y-6); ctx.lineTo(x+6,y-1); ctx.lineTo(x+1,y+1); ctx.closePath(); ctx.fill();
  // Specular
  ctx.fillStyle = '#aaa89a';
  ctx.fillRect(x-1, y-5, 3, 2);
}
</script>
<script>
// ============================================================================
// Drawing — Buildings
// ============================================================================
function drawBuilding(bld, rx, ry) {
  ctx.save();
  ctx.translate(rx, ry);
  const pct = bld.complete ? 1 : bld.progress / bld.constructionTime;

  if (!bld.complete) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(20, 36, 22, 6, 0, 0, Math.PI*2); ctx.fill();

<script>
// ============================================================================
// Drawing — Agents
// ============================================================================
const RACE_BODY = { human: '#3355aa', dwarf: '#aa6633', elf: '#33aa55', orc: '#aa3333' };
const RACE_SKIN = { human: '#f0c8a0', dwarf: '#d4a870', elf: '#f0c8a0', orc: '#7ab648' };
const PERSONALITY_HAT = { analyst: '#4488cc', optimist: '#ffcc33', dreamer: '#cc88ff', overachiever: '#ff4444', aggressive: '#cc2222', chaotic: '#ff66ff', grinder: '#888888', lazy: '#66aaaa' };
const RACE_COLORS = { human: '#3355aa', dwarf: '#aa6633', elf: '#33aa55', orc: '#aa3333' };

function drawAgent(agent, rx, ry) {
  const knock = agent.knockedOut;
  ctx.save();
  ctx.translate(rx, ry);
  if (knock) { ctx.rotate(Math.PI / 2); ctx.globalAlpha = 0.5; }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 14, 9, 4, 0, 0, Math.PI*2); ctx.fill();

  const body = RACE_BODY[agent.race] || '#3355aa';
  const skin = RACE_SKIN[agent.race] || '#f0c8a0';

  // Body/tunic
  ctx.fillStyle = body;
  ctx.fillRect(-7, -10, 14, 18);
  // Belt
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-7, 2, 14, 2);

  // Head
  ctx.fillStyle = skin;
  ctx.fillRect(-6, -20, 12, 10);

  // Eyes
  ctx.fillStyle = '#111';
  if (agent.facing === 'right') {
    ctx.fillRect(-1, -17, 2, 2); ctx.fillRect(3, -17, 2, 2);
  } else {
    ctx.fillRect(-5, -17, 2, 2); ctx.fillRect(-1, -17, 2, 2);
  }

  // Hat/helmet
  ctx.fillStyle = PERSONALITY_HAT[agent.personality] || '#666';
  ctx.fillRect(-7, -24, 14, 4);
  ctx.fillRect(-5, -26, 10, 3);

  // Legs with walk animation
  const walking = !['idle','rest'].includes(agent.currentTask);
  const walk = walking ? Math.sin(agent.animFrame * 0.2) * 4 : 0;
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-5, 8, 4, 6 + walk);
  ctx.fillRect(1, 8, 4, 6 - walk);
  // Boots
  ctx.fillStyle = '#2a1a0a';
  ctx.fillRect(-6, 13 + Math.max(0, walk), 5, 3);
  ctx.fillRect(0, 13 + Math.max(0, -walk), 5, 3);

  // Arms
  ctx.fillStyle = body;
  ctx.fillRect(-9, -8, 3, 12);
  ctx.fillRect(6, -8, 3, 12);

  // Held tool
  if (agent.currentTask === 'chop') {
    ctx.fillStyle = '#6a5030'; ctx.fillRect(8, -12, 2, 16);
    ctx.fillStyle = '#aaa'; ctx.fillRect(7, -14, 5, 4);
  } else if (agent.currentTask === 'mine') {
    ctx.fillStyle = '#6a5030'; ctx.fillRect(8, -10, 2, 14);
    ctx.fillStyle = '#aaa'; ctx.fillRect(6, -12, 7, 3);
  } else if (agent.currentTask === 'build') {
    ctx.fillStyle = '#6a5030'; ctx.fillRect(8, -8, 2, 12);
    ctx.fillStyle = '#888'; ctx.fillRect(6, -10, 5, 4);
  }

  // Health bar if damaged
  if (agent.health < 100 && !knock) {
    ctx.fillStyle = '#111'; ctx.fillRect(-10, -30, 20, 4);
    ctx.fillStyle = agent.health > 50 ? '#33cc33' : agent.health > 25 ? '#ccaa33' : '#cc3333';
    ctx.fillRect(-10, -30, 20 * (agent.health / 100), 4);
  }
  ctx.restore();

  // Name tag
  if (!knock) {
    ctx.font = 'bold 10px monospace';
    const tw = ctx.measureText(agent.name).width;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const tagX = rx - tw/2 - 4, tagY = ry - 37;
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(tagX, tagY, tw + 8, 14, 3); }
    else { ctx.rect(tagX, tagY, tw + 8, 14); }
    ctx.fill();
    // Small arrow
    ctx.beginPath(); ctx.moveTo(rx-3, tagY+14); ctx.lineTo(rx, tagY+17); ctx.lineTo(rx+3, tagY+14); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(agent.name, rx, tagY + 11);
    ctx.textAlign = 'left';
  }
}

// ============================================================================
// Drawing — Animals
// ============================================================================
function drawAnimal(animal, rx, ry) {
  ctx.save();
  ctx.translate(rx, ry);

  if (animal.type === 'deer') {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(1, 6, 8, 3, 0, 0, Math.PI*2); ctx.fill();
    // Body
    ctx.fillStyle = '#a07040'; ctx.fillRect(-7, -4, 14, 8);
    // Lighter belly
    ctx.fillStyle = '#c09060'; ctx.fillRect(-5, 0, 10, 3);
    // Head
    ctx.fillStyle = '#8a6030'; ctx.fillRect(-10, -8, 5, 6);
    // Eye
    ctx.fillStyle = '#222'; ctx.fillRect(-9, -7, 2, 2);
    // Legs
    ctx.fillStyle = '#7a5020';
    ctx.fillRect(-5, 4, 2, 5); ctx.fillRect(-1, 4, 2, 5); ctx.fillRect(3, 4, 2, 5);
    // Antlers
    ctx.fillStyle = '#6a5020';
    ctx.fillRect(-10, -13, 1, 6); ctx.fillRect(-11, -14, 3, 1);
    ctx.fillRect(-7, -12, 1, 5); ctx.fillRect(-8, -13, 3, 1);
  } else if (animal.type === 'rabbit') {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, 3, 4, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c0a888';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d0b898';
    ctx.beginPath(); ctx.ellipse(-4, -3, 3, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(-5, -4, 1, 1);
    ctx.fillStyle = '#d0b898'; ctx.fillRect(-5, -9, 2, 5); ctx.fillRect(-2, -9, 2, 5);
    ctx.fillStyle = '#e0b0b0'; ctx.fillRect(-4, -8, 1, 3); ctx.fillRect(-1, -8, 1, 3);
  } else if (animal.type === 'chicken') {
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath(); ctx.ellipse(0, 3, 5, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f0e0c0';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8d0b0';
    ctx.beginPath(); ctx.arc(-4, -3, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#cc3300'; ctx.fillRect(-5, -6, 3, 3);
    ctx.fillStyle = '#ff8800'; ctx.fillRect(-7, -3, 3, 1);
    ctx.fillStyle = '#222'; ctx.fillRect(-5, -4, 1, 1);
    // Legs
    ctx.fillStyle = '#cc8800'; ctx.fillRect(-2, 3, 1, 3); ctx.fillRect(1, 3, 1, 3);
  } else if (animal.type === 'wolf') {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(1, 6, 9, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#505050'; ctx.fillRect(-8, -4, 16, 8);
    ctx.fillStyle = '#606060'; ctx.fillRect(-10, -8, 6, 6);
    ctx.fillStyle = '#404040';
    ctx.fillRect(-6, 4, 2, 5); ctx.fillRect(-2, 4, 2, 5); ctx.fillRect(4, 4, 2, 5);
    ctx.fillStyle = '#333'; ctx.fillRect(-10, -11, 2, 4); ctx.fillRect(-6, -11, 2, 4);
    ctx.fillStyle = '#ccaa00'; ctx.fillRect(-9, -7, 2, 2);
  } else if (animal.type === 'fish') {
    const jumping = animal.jumpTimer < 20;
    const jumpY = jumping ? -Math.sin((20 - animal.jumpTimer) / 20 * Math.PI) * 10 : 0;
    ctx.translate(0, jumpY);
    ctx.globalAlpha = jumping ? 1 : 0.5;
    ctx.fillStyle = '#5588bb';
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4477aa';
    ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(9, -3); ctx.lineTo(9, 3); ctx.closePath(); ctx.fill();
    if (jumping) {
      ctx.fillStyle = 'rgba(150,200,255,0.4)';
      ctx.beginPath(); ctx.arc(-1, 5, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(2, 7, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

<script>
// ============================================================================
// WebSocket, Input, UI
// ============================================================================
let ws = null, connected = false, spectatorPoints = 0;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => { connected = true; document.getElementById('loading').style.display = 'none'; document.getElementById('reconnect').style.display = 'none'; document.getElementById('game-container').style.display = 'block'; resize(); };
  ws.onclose = () => { connected = false; document.getElementById('reconnect').style.display = 'flex'; setTimeout(connect, 3000); };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        serverState = msg;
        if (msg.terrainMods) {
          let changed = false;
          for (const mod of msg.terrainMods) {
            if (terrainData[mod.y] && terrainData[mod.y][mod.x]) {
              const c = terrainData[mod.y][mod.x];
              if (mod.hasTree !== undefined && c.hasTree !== mod.hasTree) { c.hasTree = mod.hasTree; changed = true; }
              if (mod.hasRock !== undefined) c.hasRock = mod.hasRock;
              if (mod.stump !== undefined) c.stump = mod.stump;
            }
          }
          if (changed) terrainDirty = true;
        }
        updateUI(msg);
        if (msg.activeEvent && msg.activeEvent !== lastBannerText) {
          lastBannerText = msg.activeEvent;
          const banner = document.getElementById('event-banner');
          banner.textContent = msg.activeEvent;
          banner.classList.add('visible');
          bannerTimer = 180;
        }
      } else if (msg.type === 'points_update') {
        spectatorPoints = msg.points;
        document.getElementById('points-display').textContent = msg.points;
      }
    } catch (err) {}
  };
}

// Input
canvas.addEventListener('mousedown', (e) => { if (e.button === 0) { dragging = true; dragStartX = e.clientX; dragStartY = e.clientY; dragCamX = camX; dragCamY = camY; canvas.style.cursor = 'grabbing'; followAgent = null; } });
window.addEventListener('mousemove', (e) => { if (dragging) { camX = dragCamX - (e.clientX - dragStartX) / zoom; camY = dragCamY - (e.clientY - dragStartY) / zoom; } });
window.addEventListener('mouseup', () => { dragging = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); const old = zoom; zoom = Math.max(0.3, Math.min(3, zoom * (e.deltaY < 0 ? 1.1 : 0.9))); camX += e.clientX / old - e.clientX / zoom; camY += (e.clientY - 40) / old - (e.clientY - 40) / zoom; }, { passive: false });
canvas.addEventListener('dblclick', (e) => { if (!serverState) return; const wx = camX + e.clientX / zoom, wy = camY + (e.clientY-40) / zoom; let cl = null, md = 60; for (const a of serverState.agents) { const d = Math.abs(a.x-wx)+Math.abs(a.y-wy); if (d<md) { md=d; cl=a; } } if (cl) { followAgent = cl.name; selectedAgent = cl.name; showAgentDetail(cl.name); } });
function resize() { W = window.innerWidth; H = window.innerHeight; canvas.width = W; canvas.height = H; }
window.addEventListener('resize', resize);

// Agent detail
function showAgentDetail(name) { document.getElementById('agent-detail').style.display = 'block'; }
function updateAgentDetail() {
  if (!selectedAgent || !serverState) return;
  const a = serverState.agents.find(ag => ag.name === selectedAgent);
  if (!a) { document.getElementById('agent-detail').style.display = 'none'; return; }
  document.getElementById('detail-name').textContent = a.name + ' (' + a.race + ' ' + a.personality + ')';
  const TI = { idle:'Idle', chop:'Chopping', mine:'Mining', forage:'Foraging', build:'Building', rest:'Resting', explore:'Exploring', socialize:'Chatting', fight:'Fighting!', flee:'Fleeing!' };
  document.getElementById('detail-info').innerHTML = 'Task: <b>' + (TI[a.currentTask]||a.currentTask) + '</b>' + (a.clan ? ' | Clan: ' + ((serverState.clans.find(c=>c.id===a.clan)||{}).name||'?') : '') + (a.knockedOut ? ' | <span style="color:#f44">KO</span>' : '') + ' | K:' + a.kills + ' B:' + a.buildingsBuilt;
  const bar = (l,v,m,c) => '<div style="margin:1px 0"><span style="display:inline-block;width:50px;color:#777">' + l + '</span><span style="display:inline-block;width:100px;height:5px;background:#1a1a24;border-radius:2px;vertical-align:middle"><span style="display:inline-block;width:' + (v/m*100) + '%;height:100%;background:' + c + ';border-radius:2px"></span></span> <span style="color:#666">' + Math.round(v) + '</span></div>';
  document.getElementById('detail-stats').innerHTML = bar('HP',a.health,100,a.health>50?'#33cc33':'#cc3333') + bar('Energy',a.energy,100,'#3388cc') + bar('Hunger',a.hunger,100,'#cc8833') + bar('Morale',a.morale,100,'#cccc33');
  document.getElementById('detail-inventory').innerHTML = '<span style="color:#8B6914">W:' + a.inventory.wood + '</span> <span style="color:#888">S:' + a.inventory.stone + '</span> <span style="color:#ffd700">G:' + (a.inventory.gold||0) + '</span> <span style="color:#6a4">F:' + a.inventory.food + '</span>';
  const rels = Object.entries(a.relationships||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);
  document.getElementById('detail-relations').innerHTML = rels.length ? rels.map(([n,v])=>n+':'+(v>0?'+':'')+Math.round(v)).join(' ') : '';
}
document.getElementById('detail-close').addEventListener('click', () => { document.getElementById('agent-detail').style.display = 'none'; selectedAgent = null; });

// Deploy/influence
document.getElementById('deploy-btn').addEventListener('click', () => { if (!ws||ws.readyState!==1) return; ws.send(JSON.stringify({type:'deploy_agent', name:document.getElementById('deploy-name').value||undefined, race:document.getElementById('deploy-race').value, personality:document.getElementById('deploy-personality').value})); });
document.getElementById('btn-food').addEventListener('click', () => { if (!ws||ws.readyState!==1) return; ws.send(JSON.stringify({type:'drop_food', x:camX+W/(2*zoom), y:camY+H/(2*zoom)})); });
document.getElementById('btn-rain').addEventListener('click', () => { if (!ws||ws.readyState!==1) return; ws.send(JSON.stringify({type:'trigger_rain'})); });
document.getElementById('btn-speed').addEventListener('click', () => { if (!ws||ws.readyState!==1||!serverState) return; const t = serverState.agents[Math.floor(Math.random()*serverState.agents.length)]; if(t) ws.send(JSON.stringify({type:'speed_boost', target:t.name})); });
document.getElementById('btn-gift').addEventListener('click', () => { if (!ws||ws.readyState!==1) return; ws.send(JSON.stringify({type:'mystery_gift'})); });

// UI update
function updateUI(state) {
  document.getElementById('era-display').textContent = state.era.charAt(0).toUpperCase() + state.era.slice(1);
  document.getElementById('pop-display').textContent = state.agents.length;
  document.getElementById('bld-display').textContent = state.buildings.filter(b=>b.complete).length;
  document.getElementById('day-display').textContent = state.day;
  document.getElementById('spec-display').textContent = state.spectatorCount;
  document.getElementById('event-display').textContent = state.activeEvent || '';
  // Time icon
  const isDay = state.timeOfDay > 0.25 && state.timeOfDay < 0.75;
  document.getElementById('time-icon-display').innerHTML = isDay ? '<span style="color:#ffd700">&#9788;</span>' : '<span style="color:#aaccff">&#9789;</span>';

  const TI = { idle:'Idle', chop:'Chopping', mine:'Mining', forage:'Foraging', build:'Building', rest:'Resting', explore:'Exploring', socialize:'Chatting', fight:'Fighting!', flee:'Fleeing!' };
  let ah = '';
  for (const a of state.agents) {
    const col = a.clan ? (state.clans.find(c=>c.id===a.clan)||{}).color||'#888' : RACE_COLORS[a.race]||'#888';
    const hc = a.health>50?'#33cc33':a.health>25?'#ccaa33':'#cc3333';
    ah += '<div class="agent-item" data-agent="'+a.name+'"><span class="agent-dot" style="background:'+col+'"></span><span><span class="agent-name">'+a.name+'</span><br><span class="agent-task">'+(TI[a.currentTask]||a.currentTask)+'</span></span><span class="agent-health-bar"><span class="agent-health-fill" style="width:'+a.health+'%;background:'+hc+'"></span></span></div>';
  }
  const al = document.getElementById('agent-list'); al.innerHTML = ah;
  al.querySelectorAll('.agent-item').forEach(el => { el.addEventListener('click', () => { followAgent = el.dataset.agent; selectedAgent = el.dataset.agent; showAgentDetail(el.dataset.agent); }); });

  document.getElementById('settlement-list').innerHTML = state.settlements.map(s => '<div class="settlement-item">' + s.name + ' <span style="color:#666">(' + s.phase + ', ' + (s.buildingCount||0) + ')</span></div>').join('');
  document.getElementById('clan-list').innerHTML = state.clans.map(c => '<div style="color:'+c.color+';padding:2px 0;font-size:12px">'+c.name+' <span style="color:#555">('+c.members.length+')</span></div>').join('');
  document.getElementById('event-feed').innerHTML = state.recentEvents.slice(0,15).map(e => '<div class="event-item">'+e.text+'</div>').join('');

  // Minimap
  minimapCtx.drawImage(minimapCache, 0, 0);
  const mw = minimapCanvas.width, mh = minimapCanvas.height;
  const msx = mw / (WORLD_WIDTH * TILE_SIZE), msy = mh / (WORLD_HEIGHT * TILE_SIZE);
  for (const b of state.buildings) { minimapCtx.fillStyle = b.complete ? '#ffd700' : '#886600'; minimapCtx.fillRect(b.x*TILE_SIZE*msx-1, b.y*TILE_SIZE*msy-1, 3, 3); }
  for (const a of state.agents) { minimapCtx.fillStyle = RACE_COLORS[a.race]||'#ff4444'; minimapCtx.fillRect(a.x*msx-1, a.y*msy-1, 3, 3); }
  minimapCtx.strokeStyle = 'rgba(255,255,255,0.7)'; minimapCtx.lineWidth = 1;
  minimapCtx.strokeRect(camX*msx, camY*msy, W/zoom*msx, H/zoom*msy);

  updateAgentDetail();
}

minimapCanvas.addEventListener('click', (e) => { const r = minimapCanvas.getBoundingClientRect(); camX = ((e.clientX-r.left)/minimapCanvas.width)*WORLD_WIDTH*TILE_SIZE - W/(2*zoom); camY = ((e.clientY-r.top)/minimapCanvas.height)*WORLD_HEIGHT*TILE_SIZE - H/(2*zoom); followAgent = null; });
</script>
<script>
// ============================================================================
// Main Render Loop
// ============================================================================
let lastFrame = performance.now();

function render(now) {
  requestAnimationFrame(render);
  const dt = Math.min(now - lastFrame, 100);
  lastFrame = now;

  // FPS
  fpsCounter++;
  if (now - fpsTime >= 1000) { fpsDisplay = fpsCounter; fpsCounter = 0; fpsTime = now; document.getElementById('fps-display').textContent = fpsDisplay + ' FPS'; }

  if (!serverState) return;

  // Follow agent
  if (followAgent) {
    const a = serverState.agents.find(ag => ag.name === followAgent);
    if (a) { camX += (a.x - W/(2*zoom) - camX) * 0.05; camY += (a.y - H/(2*zoom) - camY) * 0.05; }
  }
  const maxX = WORLD_WIDTH*TILE_SIZE - W/zoom, maxY = WORLD_HEIGHT*TILE_SIZE - H/zoom;
  camX = Math.max(0, Math.min(maxX, camX));
  camY = Math.max(0, Math.min(maxY, camY));

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -camY);

  // Viewport
  const vx1 = Math.max(0, Math.floor(camX / TILE_SIZE) - 2);
  const vy1 = Math.max(0, Math.floor(camY / TILE_SIZE) - 2);
  const vx2 = Math.min(WORLD_WIDTH, Math.ceil((camX + W/zoom) / TILE_SIZE) + 2);
  const vy2 = Math.min(WORLD_HEIGHT, Math.ceil((camY + H/zoom) / TILE_SIZE) + 2);

  // Redraw terrain cache if dirty
  if (terrainDirty) renderTerrainCache();

  // 1. Terrain
  ctx.drawImage(terrainCache, 0, 0);

  // 2. Water effects
  const st = now * 0.001;
  for (let y = vy1; y < vy2; y++) {
    for (let x = vx1; x < vx2; x++) {
      const cell = terrainData[y][x];
      if (cell.type === 'shallow_water' || cell.type === 'deep_water') {
        // Subtle shimmer
        const sh = Math.sin(st * 1.5 + x * 0.7 + y * 0.5) * 0.12;
        if (sh > 0) {
          ctx.fillStyle = 'rgba(100,170,240,' + sh.toFixed(2) + ')';
          ctx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
        // Wave edge dots — check if adjacent to land
        const isEdge = (x > 0 && !terrainData[y][x-1].type.includes('water')) ||
                       (x < WORLD_WIDTH-1 && !terrainData[y][x+1].type.includes('water')) ||
                       (y > 0 && !terrainData[y-1][x].type.includes('water')) ||
                       (y < WORLD_HEIGHT-1 && !terrainData[y+1][x].type.includes('water'));
        if (isEdge) {
          const waveOff = Math.floor(now * 0.002 + x + y) % 3;
          ctx.fillStyle = 'rgba(102,170,238,0.5)';
          ctx.fillRect(x*TILE_SIZE + (waveOff*5)%14, y*TILE_SIZE + (waveOff*3)%14, 2, 2);
          ctx.fillRect(x*TILE_SIZE + ((waveOff+1)*7)%14, y*TILE_SIZE + ((waveOff+2)*4)%14, 2, 2);
        }
      }
    }
  }

  // 3. Collect entities for Y-sorting
  const drawList = [];

  for (let y = vy1; y < vy2; y++) {
    for (let x = vx1; x < vx2; x++) {
      if (terrainData[y][x].stump) drawList.push({ type:'stump', y:y*TILE_SIZE+TILE_SIZE, x:x*TILE_SIZE+TILE_SIZE/2 });
      if (terrainData[y][x].renderTree && terrainData[y][x].hasTree) {
        let wobble = 0;
        for (const a of serverState.agents) {
          if (a.currentTask === 'chop' && a.taskTimer > 0) {
            const tx = Math.floor((a.targetX||0) / TILE_SIZE), ty = Math.floor((a.targetY||0) / TILE_SIZE);
            if (tx === x && ty === y) { wobble = Math.sin(now * 0.008) * 0.06; break; }
          }
        }
        drawList.push({ type:'tree', y:y*TILE_SIZE+TILE_SIZE, x:x*TILE_SIZE+TILE_SIZE/2, treeType:terrainData[y][x].treeType, wobble });
      }
      if (terrainData[y][x].hasRock) drawList.push({ type:'rock', y:y*TILE_SIZE+TILE_SIZE, x:x*TILE_SIZE+TILE_SIZE/2 });
    }
  }

  // Buildings
  for (const b of serverState.buildings) {
    if (b.x >= vx1-1 && b.x <= vx2+1 && b.y >= vy1-1 && b.y <= vy2+1)
      drawList.push({ type:'building', y:b.y*TILE_SIZE+TILE_SIZE+16, x:b.x*TILE_SIZE, data:b });
  }

  // Animals
  for (const a of serverState.animals) {
    const gx = a.x/TILE_SIZE, gy = a.y/TILE_SIZE;
    if (gx >= vx1-1 && gx <= vx2+1 && gy >= vy1-1 && gy <= vy2+1) {
      const key = a.type+'_'+Math.round(a.x/40)+'_'+Math.round(a.y/40);
      if (!interpPos[key]) interpPos[key] = { x:a.x, y:a.y };
      interpPos[key].x += (a.x - interpPos[key].x) * 0.12;
      interpPos[key].y += (a.y - interpPos[key].y) * 0.12;
      drawList.push({ type:'animal', y:interpPos[key].y, x:interpPos[key].x, data:a, rx:interpPos[key].x, ry:interpPos[key].y });
    }
  }

  // Agents
  for (const a of serverState.agents) {
    const gx = a.x/TILE_SIZE, gy = a.y/TILE_SIZE;
    if (gx >= vx1-3 && gx <= vx2+3 && gy >= vy1-3 && gy <= vy2+3) {
      if (!interpPos[a.name]) interpPos[a.name] = { x:a.x, y:a.y };
      interpPos[a.name].x += (a.x - interpPos[a.name].x) * 0.12;
      interpPos[a.name].y += (a.y - interpPos[a.name].y) * 0.12;
      drawList.push({ type:'agent', y:interpPos[a.name].y+8, x:interpPos[a.name].x, data:a, rx:interpPos[a.name].x, ry:interpPos[a.name].y });
    }
  }

  // Y-sort
  drawList.sort((a, b) => a.y - b.y);

  // Draw
  for (const item of drawList) {
    switch (item.type) {
      case 'stump': drawStump(item.x, item.y - 2); break;
      case 'tree': drawTree(item.x, item.y, item.treeType, item.wobble); break;
      case 'rock': drawRock(item.x, item.y - 2); break;
      case 'building': drawBuilding(item.data, item.x, item.y - TILE_SIZE - 16); break;
      case 'animal': drawAnimal(item.data, item.rx, item.ry); break;
      case 'agent': drawAgent(item.data, item.rx, item.ry); break;
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1, p.y - 1, p.size, p.size);
    ctx.globalAlpha = 1;
  }

  // Generate task particles (only at agent position, not random)
  for (const a of serverState.agents) {
    const ip = interpPos[a.name];
    if (!ip) continue;
    if (a.currentTask === 'chop' && a.taskTimer > 0 && Math.random() < 0.12) {
      particles.push({ x:ip.x+(Math.random()-0.5)*6, y:ip.y-12, vx:(Math.random()-0.5)*1.5, vy:-Math.random()*1.5, life:18, maxLife:18, color:'#8B6914', size:2 });
    }
    if (a.currentTask === 'mine' && a.taskTimer > 0 && Math.random() < 0.1) {
      particles.push({ x:ip.x+(Math.random()-0.5)*6, y:ip.y-12, vx:(Math.random()-0.5)*1.5, vy:-Math.random()*1.5, life:14, maxLife:14, color: Math.random()<0.3?'#ffcc00':'#888', size:2 });
    }
    if (a.currentTask === 'fight' && Math.random() < 0.15) {
      particles.push({ x:ip.x+(Math.random()-0.5)*8, y:ip.y-4, vx:(Math.random()-0.5)*2, vy:-Math.random()*1.5, life:10, maxLife:10, color:'#ff3333', size:3 });
    }
    // Red combat flash
    if (a.currentTask === 'fight') {
      ctx.fillStyle = 'rgba(255,50,50,' + (0.1 + Math.sin(now*0.01)*0.08).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(ip.x, ip.y, 18, 0, Math.PI*2); ctx.fill();
    }
    // Floating damage
    if (!a._prevHealth) a._prevHealth = a.health;
    if (a.health < a._prevHealth) {
      floatingTexts.push({ x:ip.x, y:ip.y-28, text:'-'+Math.round(a._prevHealth-a.health), color:'#ff4444', life:40, maxLife:40 });
    }
    a._prevHealth = a.health;
  }

  // Floating texts
  for (let i = floatingTexts.length-1; i >= 0; i--) {
    const ft = floatingTexts[i]; ft.y -= 0.5; ft.life--;
    if (ft.life <= 0) { floatingTexts.splice(i,1); continue; }
    ctx.globalAlpha = ft.life / ft.maxLife;
    ctx.fillStyle = ft.color; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  // Day/night overlay with smooth cosine interpolation
  const tod = serverState.timeOfDay;
  let overlayR = 10, overlayG = 10, overlayB = 40, overlayA = 0;
  if (tod < 0.20 || tod > 0.80) {
    overlayA = 0.4; overlayR = 10; overlayG = 10; overlayB = 40;
  } else if (tod < 0.30) {
    const t = (tod - 0.20) / 0.10;
    const cs = (1 - Math.cos(t * Math.PI)) * 0.5; // smooth
    overlayA = 0.4 * (1 - cs);
    overlayR = Math.floor(255 * 0.15 * (1-cs));
    overlayG = Math.floor(180 * 0.08 * (1-cs));
    overlayB = Math.floor(100 * 0.05 * (1-cs));
  } else if (tod > 0.70 && tod <= 0.80) {
    const t = (tod - 0.70) / 0.10;
    const cs = (1 - Math.cos(t * Math.PI)) * 0.5;
    overlayA = 0.4 * cs;
    if (cs < 0.5) { overlayR = Math.floor(255*0.15*cs*2); overlayG = Math.floor(140*0.1*cs*2); overlayB = Math.floor(60*0.1*cs*2); }
    else { overlayR = Math.floor(20*(cs-0.5)*2 + 38*(1-(cs-0.5)*2)); overlayG = Math.floor(20*(cs-0.5)*2 + 14*(1-(cs-0.5)*2)); overlayB = Math.floor(60*(cs-0.5)*2 + 6*(1-(cs-0.5)*2)); }
  }
  if (overlayA > 0.005) {
    ctx.fillStyle = 'rgba('+overlayR+','+overlayG+','+overlayB+','+overlayA.toFixed(3)+')';
    ctx.fillRect(camX, camY, W/zoom, H/zoom);
  }

  // Night window glow + campfire glow
  const isNight = tod > 0.75 || tod < 0.25;
  if (isNight) {
    for (const b of serverState.buildings) {
      if (!b.complete || b.x < vx1-1 || b.x > vx2+1 || b.y < vy1-1 || b.y > vy2+1) continue;
      const bx = b.x*TILE_SIZE, by = b.y*TILE_SIZE;
      if (['Wood Hut','Log Cabin','Stone House','Town Hall','Blacksmith','Barracks','Church','Library'].includes(b.type)) {
        ctx.fillStyle = 'rgba(255,215,0,0.5)';
        ctx.fillRect(bx+4, by+12, 4, 4); ctx.fillRect(bx+28, by+12, 4, 4);
        // Glow
        ctx.fillStyle = 'rgba(255,200,80,0.06)';
        ctx.beginPath(); ctx.arc(bx+20, by+16, 30, 0, Math.PI*2); ctx.fill();
      }
      if (b.type === 'Campfire') {
        ctx.fillStyle = 'rgba(255,150,50,0.12)';
        ctx.beginPath(); ctx.arc(bx+8, by+8, 35, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  ctx.restore();

  // Banner timer
  if (bannerTimer > 0) { bannerTimer--; if (bannerTimer <= 0) { document.getElementById('event-banner').classList.remove('visible'); lastBannerText = ''; } }
}

connect();
requestAnimationFrame(render);
</script>
</body>
</html>
